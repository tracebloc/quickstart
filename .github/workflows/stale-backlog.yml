name: Close stale backlog issues

# REUSABLE ((internal ref) -> (internal ref) item 1): `actions/stale` exempts on LABELS
# ONLY and has no concept of the board, so a `North Stars` or `In progress` item
# auto-closed after 8 weeks of silence like a Backlog item. Board awareness cannot
# be expressed as a label, so it cannot be a config knob on an action -- it needs a
# script, and a script cannot be maintained as sixteen byte-identical copies.
#
# The eligibility rule is an ALLOW-LIST OF ONE -- exactly `Backlog`, on a card that
# is not archived (archived cards keep their Status, Bugbot on (internal ref));
# every other column, an archived card, no card and an unreadable Status are
# skipped, so a column added next year is safe by default. FAIL CLOSED HERE MEANS
# SKIP, not act: this sweep is destructive, so an unreadable board means "leave it
# alone", and `strict: true` additionally reddens the run. The rule and its 30-case
# decision table are `scripts/stale-backlog.py` and `scripts/tests/stale-backlog-selftest.py`
# in this repo's tools checkout; callers stay thin so the rule has exactly one home.

on:
  schedule:
    - cron: '0 0 * * 1'  # Mondays 00:00 UTC
  workflow_dispatch: {}
# Only `contents: read`: the sweep's writes go through the App token minted below,
# not through GITHUB_TOKEN. Asking for `issues: write` here would exceed a minimal
# caller's grant and fail the run at startup with no jobs — the same constraint
# code-quality.yml documents.
permissions:
  contents: read

jobs:
  stale:
    name: stale / stale
    runs-on: ubuntu-slim
    # 14, not 15: a timeout AT `ubuntu-slim`'s 15-minute cap can never speak, the
    # platform kills the job first (scripts/runner-tier.py asserts it). Measured:
    # stale / stale runs 49 s, so the budget is not what constrains it either way.
    timeout-minutes: 14
    steps:
      # Authenticates as the tracebloc-release-train App ((internal ref)), App-native
      # from the start; `owner:` makes the token ORG-scoped -- a repo-scoped one
      # cannot read the project, and the sweep would skip every issue as UNKNOWN.
      #
      # SCOPED FROM THE START ((internal ref)), derived from what the sweep calls:
      #   issues: write               `issue edit --add-label`, `issue comment`,
      #                              `issue close`
      #   organization-projects: read  ISSUES_Q reads `projectItems .. Status`; the
      #                              sweep never writes a board field
      # No `pull-requests` (issues only, (internal ref)); no `contents` (the tools
      # checkout below uses its own read-only token). `repositories:` NARROWS THE
      # ISSUE WRITES to the caller's repo -- a destructive, unattended sweep must
      # not hold close rights on every repo -- and org projects are unaffected by
      # repo scoping (measured under (internal ref)).
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-organization-projects: read

      # The script comes from this repo's tools checkout, not the caller: one copy of the rule.
      - name: Mint a read-only token for org-config (private; the caller's own token cannot read it)
        id: org-config-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-config
          permission-contents: read

      # THE TOOLS REF ((internal ref) D4, (internal ref)): `job.workflow_sha` is the commit
      # of THIS reusable file, so the scripts below are the ones it was reviewed
      # with; `tools-ref` overrides it for a test. An EMPTY ref would check out the
      # tools repo's DEFAULT branch fleet-wide, so it is refused. `toJSON(job)` because
      # actionlint's `job` schema (1.7.12) does not know `workflow_sha`.
