name: Set PR card Status on project

# Reusable workflow. Called from each active repo on PR open / reopen /
# draft-toggle / title-or-body edit (`edited`, (internal ref): so the
# `closing-ref` job re-runs when the fields it reads change). Moves the PR's
# card to the right Status:
#   - draft PR  → In progress
#   - non-draft → Code review
#
# TWO JOBS, and the second one is here on purpose ((internal ref)):
#
#   set-status    writes the card's Status (below)
#   closing-ref   checks that a PR whose TITLE names a ticket actually LINKS it
#
# closing-ref LIVES HERE because this is the only host that (1) mints an
# ORG-SCOPED App token able to read an issue in another repo -- code-quality.yml
# is deliberately secretless and cannot widen its callers' grant --, (2) runs on
# the SAME event that puts a card in `Code review`, and (3) needs no new
# `repo-inventory.yml` row (the inventory tracks callers, one row per reusable).
# It is a required status check nowhere, and advisory by default ((internal ref)).

on:
  pull_request:
    # `edited` is load-bearing, not decoration ((internal ref)). The
    # `closing-ref` job decides its verdict from the PR TITLE and the PR BODY, and
    # `edited` is the ONLY event GitHub fires when either changes. Without it the
    # two fields the gate reads are the two fields that can change without
    # re-running it, which is a bypass rather than a gap: open a PR titled
    # `chore: tidy up`, the gate records NOTHING_NAMED and goes green, then
    # retitle it to `fix(1234): …` with nothing linked -- no event fires, the
    # green stands, and the PR merges having defeated the check.
    #
    # It also makes the remediation usable at all. Retitling or editing a body to
    # SATISFY the gate did not re-run it either, so a red persisted on a PR that
    # now complied: 20 sync PRs had to be cleared with 20 manual `gh run rerun`
    # calls ((internal ref)), because the only in-band re-trigger was closing and
    # reopening someone else's PR.
    #
    # Same one-word fix, same reason, as `fr-gate-caller.yml` ((internal ref)): a
    # gate whose verdict depends on a mutable field must re-run when that field
    # mutates.
    types: [opened, reopened, ready_for_review, converted_to_draft, edited]
# ONE RUN PER PR WINS, AND IT IS THE NEWEST ((internal ref)). Every trigger here
# can fire twice in quick succession -- `edited` made that ordinary fleet-wide
# ((internal ref)) -- and without a group the LOSER writes last: the card or the
# closing-ref verdict settles on stale input with nothing erroring. `github.ref`
# is `refs/pull/<n>/merge` on these events, so the group is per-PR;
# `github.workflow` keeps two callers in one repo apart (the `(internal ref)`
# code-quality-caller.yml shape, one house pattern).
#
# QUEUE, DO NOT CANCEL. `statusCheckRollup.state` aggregates WORST-OF across
# every check run on the commit, so one CANCELLED superseded run reports the PR
# as FAILURE and reviewers withhold approval over a red that is not one --
# measured on (internal ref), (internal ref); scripts/reusable-no-cancel.py
# holds the measurement and refuses a cancelling reusable. With
# `cancel-in-progress: false` the newer run goes PENDING and still writes last.
# The window that cancelling narrowed by accident -- a stale `edited` payload
# dragging a merged card back -- is closed by the rank guard below ((internal ref)).
# RESIDUAL: a burst of 3+ rapid edits can still leave one CANCELLED entry, since
# GitHub cancels a PENDING run a third event supersedes.
concurrency:
  group: set-pr-status-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ONLY WHILE THE PR IS OPEN ((internal ref)): `edited` fires on a
  # MERGED PR's title or body too, and every other trigger here is reachable
  # only on an open PR. Guarded by state rather than by event name, so a DRAFT
  # toggled by an edit still gets its board write. THE CONDITION IS NOT THE
  # GUARD ((internal ref)): it reads `pull_request.state` off the FROZEN payload,
  # so a queued run can arrive after the closure router moved a merged card and
  # still believe the PR is open -- editing a typo in a shipped PR dragged its
  # card from `Prod` back to `Code review`. The write step below compares the
  # card's CURRENT column against the shared pipeline order and refuses to write
  # over anything at or beyond the first post-merge column.
  set-status:
    name: set-status / set-status
    if: ${{ github.event.pull_request.state == 'open' }}
    runs-on: ubuntu-slim
    # Declared because `ubuntu-slim` kills at its 15-minute cap with no timeout
    # report ((internal ref) item 2; scripts/runner-tier.py asserts it for every
    # slim job). Measured: set-status / set-status: n=25, 20 s median, 71 s max.
    timeout-minutes: 10
    steps:
      - name: Determine target Status
        id: target
        run: |
          if [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "status_name=In progress" >> "$GITHUB_OUTPUT"
          else
            echo "status_name=Code review" >> "$GITHUB_OUTPUT"
          fi

      # THE PIPELINE ORDER IS FETCHED, NOT CARRIED ((internal ref)): the write below
      # has to know whether the card has already left review, and the org's ONE
      # declaration of the order is `scripts/pipeline_rank.sh` in this repo, which
      # advance-deploy-env.yml reads for the same comparison (CLAUDE.md rule 1).
      # Same shape and App as the closing-ref job: this repo is PRIVATE, so the
      # caller's own token cannot read it; the App key arrives via `secrets: inherit`.
      - name: Mint a read-only token for org-config (private; the caller's own token cannot read it)
        id: rank-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-config
          permission-contents: read

      # THE TOOLS REF ((internal ref) D4, (internal ref)): `job.workflow_sha` is the commit
      # of THIS reusable file, so the scripts below are the ones it was reviewed
      # with; `tools-ref` overrides it for a test. An EMPTY ref would check out the
      # tools repo's DEFAULT branch fleet-wide, so it is refused. `toJSON(job)` because
      # actionlint's `job` schema (1.7.12) does not know `workflow_sha`.
      - name: Resolve the tools ref, refusing an empty one
        id: tools-ref
        env:
          TOOLS_REF: ${{ 'main' }}
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          if [ -z "$TOOLS_REF" ]; then
            case "$JOB_CONTEXT" in
              *'"workflow_sha"'*) TOOLS_REF="${JOB_CONTEXT#*\"workflow_sha\": \"}"; TOOLS_REF="${TOOLS_REF%%\"*}" ;;
            esac
          fi
          if ! [[ "$TOOLS_REF" =~ ^[0-9a-f]{40}$ || ( -n "$TOOLS_REF" && "$TOOLS_REF" != *[![:alnum:]._/-]* ) ]]; then
            echo "::error::the tools ref is empty or not a ref (${TOOLS_REF:-<empty>}); an empty ref would check out the tools repo's default branch instead of the commit this workflow was pinned at. Refusing."
            exit 1
          fi
          echo "ref=$TOOLS_REF" >> "$GITHUB_OUTPUT"
          echo "tools ref: $TOOLS_REF"
      - name: Check out the shared pipeline order
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/org-config
          token: ${{ steps.rank-token.outputs.token }}
          ref: ${{ 'main' }}
          path: .org-config-tools
          persist-credentials: false

      # Board writes authenticate as the tracebloc-release-train App, not a human's
      # PAT ((internal ref): one shared user PAT was measured exhausted), ORG-scoped
      # by `owner:` (a repo-scoped token cannot write an org ProjectV2), with NO
      # FALLBACK TO A PAT -- a fallback would make a broken App path look like a
      # working migration. If the mint fails, this job fails.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # SCOPED TO WHAT THIS JOB ACTUALLY DOES ((internal ref)), and of the mints
          # that ticket left this one has the largest exposure because of how
          # often it runs. DERIVED FROM THE CALLS BELOW:
          #   organization.projectV2 { fields }     -> projects, read
          #   repository.pullRequest.projectItems   -> pull-requests, read
          #   updateProjectV2ItemFieldValue         -> projects, WRITE
          # NO `issues` SCOPE: this job is PR-only; the closing-ref mint below
          # carries `issues: read` because it reads the linked ISSUE -- the two
          # differ because their calls differ. A passing mint is not the proof;
          # the evidence is a card that actually moves.
          permission-pull-requests: read
          permission-organization-projects: write

      - name: Update PR Status on project
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ 'tracebloc' }}
          PROJECT_NUMBER: ${{ 2 }}
          STATUS_NAME: ${{ steps.target.outputs.status_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_FULL: ${{ github.repository }}
          # Read by the guard below, for ONE arm: `reopened` is the event that
          # revokes a `Cancelled` card, and the guard may not tell it apart from an
          # `edited` on a merged PR by anything else ((internal ref)).
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          REPO_NAME="${REPO_FULL#*/}"

          # selftest:graphql-read-start  (the ONE line every GraphQL step carries; the function is scripts/lib/graphql-read.sh)
          . .org-config-tools/scripts/lib/graphql-read.sh
          # selftest:graphql-read-end

          # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
          PROJ=$(gh api graphql -f query='
            query($org: String!, $num: Int!) {
              organization(login: $org) {
                projectV2(number: $num) {
                  id
                  fields(first: 50) {
                    nodes {
                      ... on ProjectV2SingleSelectField { id name options { id name } }
                    }
                  }
                }
              }
            }' -F org="$ORG" -F num="$PROJECT_NUMBER")
          reject_graphql_errors "$PROJ" "project #$PROJECT_NUMBER field read" || exit 1

          PROJECT_ID=$(echo "$PROJ" | jq -r '.data.organization.projectV2.id')
          STATUS_FIELD=$(echo "$PROJ" | jq -r '.data.organization.projectV2.fields.nodes[]
            | select(.name=="Status") | .id')
          STATUS_OPT=$(echo "$PROJ" | jq -r --arg s "$STATUS_NAME" '.data.organization.projectV2.fields.nodes[]
            | select(.name=="Status") | .options[] | select(.name==$s) | .id')

          # THE PIPELINE ORDER IS READ BEFORE ANYTHING IS WRITTEN: the block below
          # ADDS a missing card, so a refusal after it could not honestly say
          # "NOTHING WAS WRITTEN". Both questions the guard asks -- the first
          # post-merge column and the abandonment column ((internal ref))
          # -- are read here, so an order that cannot answer refuses before the card exists.
          RANK_TOOL=".org-config-tools/scripts/pipeline_rank.sh"
          if ! MERGED_FLOOR=$(bash "$RANK_TOOL" --first-post-merge) \
             || ! ABANDONED=$(bash "$RANK_TOOL" --abandoned); then
            echo "::error::PR #$PR_NUMBER: the shared pipeline order could not be read from" \
                 "$RANK_TOOL (its first post-merge column, or its abandonment column), so" \
                 "Status=$STATUS_NAME cannot be shown not to demote this card. NOTHING WAS WRITTEN." >&2
            exit 1
          fi

          # Wait briefly for the kanban auto-add workflow to register the PR on the project
          for i in 1 2 3 4 5; do
            # THE BODY DECIDES, WHATEVER THE EXIT CODE ((internal ref)): an exit-0
            # `errors[]` body used to read as "not yet on project" and, five reads
            # later, as a card to ADD. An unreadable response aborts instead.
            # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
            if ! RESP=$(gh api graphql -f query='
              query($org: String!, $repo: String!, $num: Int!) {
                repository(owner: $org, name: $repo) {
                  pullRequest(number: $num) {
                    state
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { number }
                        status: fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { name }
                        }
                      }
                    }
                  }
                }
              }' -F org="$ORG" -F repo="$REPO_NAME" -F num="$PR_NUMBER") \
               || ! reject_graphql_errors "$RESP" "PR #$PR_NUMBER project-item lookup"; then
              echo "::error::PR #$PR_NUMBER project-item lookup FAILED -- its board state is UNKNOWN, not absent, so nothing was added or written."
              exit 1
            fi
            ITEM_ID=$(jq -r --arg n "$PROJECT_NUMBER" 'first(.data.repository.pullRequest.projectItems.nodes[]?
                  | select(.project.number == ($n | tonumber)) | .id) // ""' <<<"$RESP")
            # READ FROM THE SAME RESPONSE THE ITEM ID CAME FROM, inside the loop.
            # A second query would be a second point in time, and the guard below
            # is about a card that moved between two points in time.
            CURRENT_STATUS=$(jq -r --arg n "$PROJECT_NUMBER" 'first(.data.repository.pullRequest.projectItems.nodes[]?
                  | select(.project.number == ($n | tonumber)) | .status.name) // ""' <<<"$RESP")
            # THE PR'S LIVE STATE, from that same response: `github.event.action`
            # is frozen at webhook time, and a `reopened` run queued while the PR
            # was closed AGAIN is a stale payload only a live read can expose
            # ((internal ref)).
            PR_STATE=$(jq -r '.data.repository.pullRequest.state // ""' <<<"$RESP")
            if [ -n "$ITEM_ID" ] && [ "$ITEM_ID" != "null" ]; then break; fi
            echo "PR not yet on project, waiting ($i/5)…"
            sleep 5
          done

          # FAIL CLOSED ((internal ref)): logging the miss and exiting 0 left a PR
          # that lost the add-to-kanban race at No Status behind a GREEN check.
          # AND END THE RACE RATHER THAN WIDEN THE WINDOW ((internal ref)): the
          # measurement the 5 x 5s budget was held open for came back -- runs that
          # lost the race by seconds, on boards already in the state this job would
          # have written, so the job's purpose was met and only its verdict was
          # wrong. `addProjectV2ItemById` is IDEMPOTENT and this token already holds
          # `organization-projects: write`, so the card is added here; add-to-kanban
          # does exactly one thing, which is what makes taking it over safe. STILL
          # FAIL-CLOSED: an unresolvable node or an add with no item id goes RED.
          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" = "null" ]; then
            echo "card absent after 5 retries - adding it here rather than waiting on add-to-kanban"
            # The node-id read's BODY is inspected before jq reduces it: an exit-0
            # errors[] payload must not become "could not be resolved" ((internal ref)).
            # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
            NODE_RESP=$(gh api graphql -f query='
              query($org: String!, $repo: String!, $num: Int!) {
                repository(owner: $org, name: $repo) { pullRequest(number: $num) { id } }
              }' -F org="$ORG" -F repo="$REPO_NAME" -F num="$PR_NUMBER" 2>&1) \
              || { echo "::error::PR #$PR_NUMBER node-id read failed: $NODE_RESP" >&2; exit 1; }
            reject_graphql_errors "$NODE_RESP" "PR #$PR_NUMBER node-id read" || exit 1
            PR_NODE_ID=$(jq -r '.data.repository.pullRequest.id // empty' <<< "$NODE_RESP")
            if [ -z "$PR_NODE_ID" ]; then
              echo "::error::PR #$PR_NUMBER could not be resolved to a node id, so its card" \
                   "cannot be added. Refusing to report a status nobody wrote."
              exit 1
            fi
            # The add's BODY is read before the item id is taken from it (a refused
            # write, not "could not be added"). AND THE ADD ANSWERS WITH THE CARD'S
            # COLUMN: idempotence cuts both ways -- when the lookup above missed an
            # existing card (more projects than the page reads) this mutation
            # returns the EXISTING card, and taking only `item.id` left
            # CURRENT_STATUS empty, so the guard ranked a `Prod` card as 0 and wrote
            # `Code review` over it. One call, one point in time; a genuinely new
            # card answers `null`, which the guard reads as "place it" (pipeline-rank-selftest.py).
            # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
            ADD_RESP=$(gh api graphql -f query='
              mutation($p: ID!, $c: ID!) {
                addProjectV2ItemById(input: {projectId: $p, contentId: $c}) {
                  item {
                    id
                    status: fieldValueByName(name: "Status") {
                      ... on ProjectV2ItemFieldSingleSelectValue { name }
                    }
                  }
                }
              }' -F p="$PROJECT_ID" -F c="$PR_NODE_ID" 2>&1) \
              || { echo "::error::PR #$PR_NUMBER add-to-project write failed: $ADD_RESP" >&2; exit 1; }
            reject_graphql_errors "$ADD_RESP" "PR #$PR_NUMBER add-to-project write" || exit 1
            ITEM_ID=$(jq -r '.data.addProjectV2ItemById.item.id // empty' <<< "$ADD_RESP")
            CURRENT_STATUS=$(jq -r '.data.addProjectV2ItemById.item.status.name // ""' <<< "$ADD_RESP")
          fi

          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" = "null" ]; then
            echo "::error::PR #$PR_NUMBER is not on project $PROJECT_NUMBER and could not be" \
                 "added to it. The board write cannot proceed; this is not a race."
            exit 1
          fi

          # ---------------------------------------------------------------
          # Refuse to write over a card that has left review ((internal ref)).
          #
          # THE DEMOTION THIS CLOSES: `edited` is on the callers deliberately
          # ((internal ref)) and fires on a MERGED PR too; the job condition reads
          # the FROZEN payload, so a queued run can write `Code review` over
          # `Prod`. RANK, NOT EVENT NAME: automation never moves a card BACKWARD
          # ((internal ref)), and an event name is a proxy wrong in both
          # directions. THE LINE IS THE FIRST POST-MERGE COLUMN, not the target's
          # rank: this job owns the pre-merge columns and legitimately moves
          # `Code review` -> `In progress` on `converted_to_draft`; it must never
          # write over a column it does not own. `pipeline_rank.sh` names that
          # anchor beside the table, so an INSERTED column needs no edit here
          # ((internal ref)).
          #
          # THE ONE COLUMN AT OR PAST THE ANCHOR THIS JOB MAY WRITE OVER, on one
          # event ((internal ref)): `Cancelled` records an ABANDONMENT, not
          # shipped work, and `reopened` revokes exactly that -- so on that event,
          # out of that column, the write goes ahead. Three things keep the
          # demotion closed: GitHub cannot fire `reopened` on a MERGED PR; the arm
          # is scoped to the single column `--abandoned` names (never spelled
          # here); and the PR must still be OPEN on the live read above, so a
          # reopen queued behind a second close sees `CLOSED` and falls through to
          # the rank guard. Every OTHER event on a `Cancelled` card still refuses.
          #
          # FAIL CLOSED, THREE WAYS, and none of them defaults to writing:
          #   unreadable order   the tool is missing or errors, on either question
          #                      asked of it above (the anchor, the abandonment) -> exit 1
          #   unplaceable column a Status the order does not declare -> exit 1,
          #                      because a card in a column nobody has ranked
          #                      cannot be shown NOT to be shipped work
          #   at or past the     refuse the write, exit 0 -- this is the
          #   anchor             ORDINARY outcome (every `edited` on a merged
          #                      PR takes it), so it must not paint the fleet
          #                      red; the notice says what was not written
          # An EMPTY current Status is none of those three: the card has just
          # been added and giving it a column is what the "no card sits at No
          # Status" invariant depends on. pipeline-rank-selftest.py drives every arm.
          CURRENT_RANK=0
          if [ -n "${CURRENT_STATUS:-}" ] && ! CURRENT_RANK=$(bash "$RANK_TOOL" "$CURRENT_STATUS"); then
            echo "::error::PR #$PR_NUMBER sits in '$CURRENT_STATUS', which the shared pipeline" \
                 "order does not declare, so Status=$STATUS_NAME cannot be shown not to demote" \
                 "it. NOTHING WAS WRITTEN. Add the column to scripts/pipeline_rank.sh in" \
                 "the shared config repository if the board really has it." >&2
            exit 1
          fi
          if [ "${EVENT_ACTION:-}" = "reopened" ] && [ "${PR_STATE:-}" = "OPEN" ] \
             && [ -n "${CURRENT_STATUS:-}" ] && [ "$CURRENT_STATUS" = "$ABANDONED" ]; then
            echo "::notice::PR #$PR_NUMBER was reopened out of '$CURRENT_STATUS' -- that column" \
                 "records a closure THIS event revokes, not shipped work, so Status=$STATUS_NAME" \
                 "is written."
          elif [ "$CURRENT_RANK" -ge "$MERGED_FLOOR" ]; then
            echo "::notice::PR #$PR_NUMBER is at '$CURRENT_STATUS', at or beyond the first" \
                 "post-merge column -- NOT writing Status=$STATUS_NAME. This event's payload" \
                 "says the PR is open; the board says the work has moved on, and the board is" \
                 "the later fact."
            exit 0
          fi

          # Pass the option ID with -f (raw string), NOT -F: ProjectV2 option IDs can
          # be all-numeric, and -F coerces all-digit values to an integer, which the
          # $o: String! variable rejects. -f forces a string. (Some option IDs contain
          # letters today, but don't rely on that — IDs regenerate if recreated.)
          # THE WRITE'S BODY IS READ TOO: an exit-0 response carrying errors[] means
          # the Status was NOT written; the success line below must not print.
          # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
          WRESP=$(gh api graphql -f query='
            mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $p, itemId: $i, fieldId: $f,
                value: {singleSelectOptionId: $o}
              }) { projectV2Item { id } }
            }' -F p="$PROJECT_ID" -F i="$ITEM_ID" -F f="$STATUS_FIELD" -f o="$STATUS_OPT" 2>&1) \
            || { echo "::error::PR #$PR_NUMBER Status=$STATUS_NAME write failed: $WRESP" >&2; exit 1; }
          reject_graphql_errors "$WRESP" "PR #$PR_NUMBER Status=$STATUS_NAME write" || exit 1

          echo "→ PR #$PR_NUMBER → Status=$STATUS_NAME"

  # ------------------------------------------------------------------------
  # A PR whose TITLE names a ticket must LINK it ((internal ref)): the
  # house convention puts the ticket in the TITLE, GitHub creates a closing link
  # only from a keyword in the BODY, so the closure router finds no linked issue
  # and every card stays unmoved behind a green pipeline. A SEPARATE job from
  # `set-status`, like code-quality.yml's six: a finding must not stop the card
  # write, and a failed write must not hide the finding. NOTHING FROM THE PR IS
  # INTERPOLATED INTO A `run:` BLOCK -- the checker reads the title from the API,
  # so a title containing shell is data, never code.
  # ------------------------------------------------------------------------
  closing-ref:
    name: set-status / closing-ref
    # Open PRs only: on a merged PR this would be advice about a merge that
    # already happened, and a late red X on a shipped PR teaches people to ignore
    # the check (rule 4). A retitle happens while the PR is open, when this runs.
    if: ${{ true && github.event.pull_request.state == 'open' }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # The checker lives here, not in the calling repo, so the reusable fetches
      # it (the code-quality.yml / bugbot-gate.yml shape). This repo is PRIVATE, so
      # the checkout needs a read-only App token, which `secrets: inherit` supplies.
      - name: Mint a read-only token for org-config (private; the caller's own token cannot read it)
        id: org-config-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-config
          permission-contents: read

      # THE TOOLS REF ((internal ref) D4, (internal ref)): `job.workflow_sha` is the commit
      # of THIS reusable file, so the scripts below are the ones it was reviewed
      # with; `tools-ref` overrides it for a test. An EMPTY ref would check out the
      # tools repo's DEFAULT branch fleet-wide, so it is refused. `toJSON(job)` because
      # actionlint's `job` schema (1.7.12) does not know `workflow_sha`.
      - name: Resolve the tools ref, refusing an empty one
        id: tools-ref
        env:
          TOOLS_REF: ${{ 'main' }}
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          if [ -z "$TOOLS_REF" ]; then
            case "$JOB_CONTEXT" in
              *'"workflow_sha"'*) TOOLS_REF="${JOB_CONTEXT#*\"workflow_sha\": \"}"; TOOLS_REF="${TOOLS_REF%%\"*}" ;;
            esac
          fi
          if ! [[ "$TOOLS_REF" =~ ^[0-9a-f]{40}$ || ( -n "$TOOLS_REF" && "$TOOLS_REF" != *[![:alnum:]._/-]* ) ]]; then
            echo "::error::the tools ref is empty or not a ref (${TOOLS_REF:-<empty>}); an empty ref would check out the tools repo's default branch instead of the commit this workflow was pinned at. Refusing."
            exit 1
          fi
          echo "ref=$TOOLS_REF" >> "$GITHUB_OUTPUT"
          echo "tools ref: $TOOLS_REF"
      - name: Check out the shared checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/org-config
          token: ${{ steps.org-config-token.outputs.token }}
          ref: ${{ 'main' }}
          path: .org-config-tools
          persist-credentials: false

      # WHY AN APP TOKEN AND NOT `github.token`: the link this reads points at an
      # issue in ANOTHER repo, and a node a repo-scoped token cannot read comes
      # back missing from `nodes` while `totalCount` still counts it -- "cannot
      # tell", the right refusal, but it would be EVERY cross-repo PR's verdict.
      # SCOPED ((internal ref)): this job reads two things and needs nothing else.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-pull-requests: read
          permission-issues: read
          # NO `contents` scope, on purpose ((internal ref)): reading
          # `defaultBranchRef` over GraphQL needs contents on a private repo, and
          # that one field failed every private-repo run from 2026-09-06 while
          # public repos passed. The default branch arrives from the event payload
          # as PR_BASE_DEFAULT_BRANCH instead, and the query no longer asks.

      - name: The title names a ticket, so the PR must link it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_DEFAULT_BRANCH: ${{ github.event.pull_request.base.repo.default_branch }}
          SOFT_FAIL: ${{ true && 'true' || 'false' }}
        run: python3 .org-config-tools/scripts/closing-ref-gate.py
