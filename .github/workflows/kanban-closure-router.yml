name: Route kanban Status on closure

# Reusable workflow. Called on PR closed + issue closed events, and sets the
# Status that matches what happened:
#   - PR merged to develop           → On dev         (automatic; no dev-side review — D6)
#   - PR merged to staging           → FR on staging  (functional review on staging environment)
#   - PR merged to main/master       → Prod           (shipped to prod)
#   - PR closed without merging      → Cancelled
#   - Issue closed as completed      → Done (terminal; how it was closed is irrelevant, (internal ref))
#   - Issue closed as not_planned, or with no state_reason → Cancelled
#
# advance-deploy-env.yml sets the same Status on the resulting branch push; both
# are idempotent and converge. This one fires faster and is the primary signal;
# advance-deploy-env also covers pushes that were not a PR merge.

on:
  pull_request:
    types: [closed]
  issues:
    types: [closed]

jobs:
  route:
    name: route / route
    runs-on: ubuntu-slim
    # Declared because `ubuntu-slim` kills at its 15-minute cap with no timeout
    # report ((internal ref) item 2; scripts/runner-tier.py asserts it for every
    # slim job). Measured: route / route: n=25, 16 s median, 45 s max.
    timeout-minutes: 10
    steps:
      # The mapping is read from this repo's tools checkout, not from a copy in
      # this file: one definition of branch -> Status ((internal ref)).
      - name: Mint a read-only token for org-config (private; the caller's own token cannot read it)
        id: org-config-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-config
          permission-contents: read

      # THE TOOLS REF ((internal ref) D4, (internal ref)): `job.workflow_sha` is the commit
      # of THIS reusable file, so the scripts below are the ones it was reviewed
      # with; `tools-ref` overrides it for a test. An EMPTY ref would check out the
      # tools repo's DEFAULT branch fleet-wide, so it is refused. `toJSON(job)` because
      # actionlint's `job` schema (1.7.12) does not know `workflow_sha`.
      - name: Resolve the tools ref, refusing an empty one
        id: tools-ref
        env:
          TOOLS_REF: ${{ 'main' }}
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          if [ -z "$TOOLS_REF" ]; then
            case "$JOB_CONTEXT" in
              *'"workflow_sha"'*) TOOLS_REF="${JOB_CONTEXT#*\"workflow_sha\": \"}"; TOOLS_REF="${TOOLS_REF%%\"*}" ;;
            esac
          fi
          if ! [[ "$TOOLS_REF" =~ ^[0-9a-f]{40}$ || ( -n "$TOOLS_REF" && "$TOOLS_REF" != *[![:alnum:]._/-]* ) ]]; then
            echo "::error::the tools ref is empty or not a ref (${TOOLS_REF:-<empty>}); an empty ref would check out the tools repo's default branch instead of the commit this workflow was pinned at. Refusing."
            exit 1
          fi
          echo "ref=$TOOLS_REF" >> "$GITHUB_OUTPUT"
          echo "tools ref: $TOOLS_REF"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/org-config
          token: ${{ steps.org-config-token.outputs.token }}
          ref: ${{ 'main' }}
          path: .org-config-tools
          persist-credentials: false

      # Authenticates as the tracebloc-release-train App ((internal ref)), ORG-scoped
      # by `owner:` (a repo-scoped token cannot reach an org ProjectV2; the label
      # and comment writes below are cross-repo besides), with no fallback to a
      # PAT -- it would let a broken App path look like a working migration.
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # LEAST PRIVILEGE, DERIVED FROM THIS JOB'S OWN CALLS ((internal ref)).
          # Four steps share this token; this is the union of what they call:
          #
          #   organization().projectV2 fields/options             projects read
          #   repository.pullRequest|issue(n).projectItems        PRs+issues read
          #   updateProjectV2ItemFieldValue                       projects WRITE
          #   gh issue comment (the D8 parked-card note)          Issues  WRITE
          #   GET repos/{r}/labels/{name} (does it exist?)        Issues  read
          #   POST repos/{r}/labels (create it)                   Issues  WRITE
          #   POST repos/{r}/issues/{n}/labels                    Issues  write
          #
          # The label endpoints are served by Issues even on a PULL REQUEST, so
          # `pull-requests` stays at READ. `contents: READ` IS REQUIRED:
          # `branch_status_map.py` FETCHES the caller's `.kanban.yml` over the API
          # under this token (this workflow never checks the caller out), and the
          # mapper's 403 would park EVERY merged PR at `override-unusable` behind a
          # green job (Bugbot on (internal ref)). `repositories:` stays
          # unnarrowed: the projectItems reads and the label/comment writes are
          # cross-repo, and `organization-projects` is an org-level grant
          # regardless. Scopes are what the calls document, not what a run has
          # proven; an under-scoped token fails at the call site ((internal ref)).
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read
          permission-organization-projects: write

      - name: Determine target Status
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ISSUE_REASON: ${{ github.event.issue.state_reason }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # ORG + REPO_FULL are read by the project lookups, the .kanban.yml
          # override mapper and the D8 parked-card comment; without them `set -u`
          # aborts before any status= is written and "Item closed" sets Cancelled.
          ORG: ${{ 'tracebloc' }}
          REPO_FULL: ${{ github.repository }}
          # The App token rather than the caller's GITHUB_TOKEN: this step's project
          # reads and the override mapper are cross-repo.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # STATUS="" means "make no change": the update step below is guarded on
          # a non-empty status and skips entirely. Every branch here either sets
          # a real column or deliberately leaves STATUS empty.
          STATUS=""

          SIBLING="false"
          # SET WHEN THE OVERRIDE COULD NOT BE USED ((internal ref)): the same
          # visibility mechanism as SIBLING, a card the weekly pass must disposition.
          # UNUSABLE, NOT UNREADABLE ((internal ref)): a `.kanban.yml` that cannot be
          # fetched AND one that names an undeclared Status both land here; the
          # mapper says which on stderr, this flag only says "we could not tell".
          UNUSABLE_OVERRIDE="false"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_MERGED" = "true" ]; then
              # ONE SHARED MAPPING ((internal ref)), FETCHED not read off disk: this
              # workflow never checks the caller out. A REFUSED OVERRIDE MUST NOT
              # COST THE WRITE (Bugbot on (internal ref)): a bare command
              # substitution under `set -euo pipefail` would exit before any Status
              # is published, and the project's built-in "Item closed" automation
              # then sets `Cancelled` ((internal ref)). The mapper refuses an
              # undeclared Status too ((internal ref)), and its STDERR IS KEPT -- that
              # message is the operator's fix. branch-status-map-selftest.py holds all three.
              if ! STATUS=$(python3 .org-config-tools/scripts/branch_status_map.py \
                              "$BASE_REF" "$REPO_FULL" "$BASE_REF" \
                              | jq -r '.status'); then
                # THE HOLDING STATE, NOT THE DEFAULT MAPPING ((internal ref)):
                # writing the default would claim a promotion on a read that failed,
                # and refusing by writing NOTHING hands the decision to the built-in
                # "Item closed" automation, which sets `Cancelled` -- so "we could
                # not tell" is expressed AS A WRITE (the selftest pins both halves).
                echo "::warning::the .kanban.yml override for $REPO_FULL could not be used (see the error above: unreadable, or it names a Status the mapping does not declare), so the Status for $BASE_REF is UNKNOWN. Writing the non-terminal holding state and labelling the card for the weekly pass -- publishing nothing would let the built-in Item-closed automation set Cancelled (.github#157)."
                STATUS="On dev"
                UNUSABLE_OVERRIDE="true"
              fi
              # KEYED ON WHETHER THE MAPPER ANSWERED, not on a list of branch names
              # (Bugbot on (internal ref)): a `case` over the stock branches
              # discarded every `.kanban.yml` key it did not list.
              if [ -z "$STATUS" ]; then
                  # A PR merged into a SIBLING feature branch deploys nothing by
                  # itself; its content ships inside the parent PR ((internal ref)
                  # mechanism 1). On dev + the sibling-merge label is the visible
                  # holding state the weekly pass dispositions; skipping the write
                  # would let "Item closed" set Cancelled (Bugbot on (internal ref)).
                  STATUS="On dev"
                  SIBLING="true"
              fi
            else
              STATUS="Cancelled"
            fi
          elif [ "$EVENT_NAME" = "issues" ]; then
            if [ "$ISSUE_REASON" = "completed" ]; then
              # A COMPLETED ISSUE IS TERMINAL: it goes to Done, however it was
              # closed ((internal ref)). Deploy state is a property of a PR; an issue
              # is finished or it is not ((internal ref) D8) -- mirroring the
              # closing PR's Status put 117 finished issues in deploy columns. This
              # RETIRES (internal ref): `Done` is terminal and archived daily, so
              # nothing is left to drift, and advance-deploy-env's matching block
              # went with it. The closer lookup went too (two fail-wrong defects,
              # (internal ref) and (internal ref); a call never made cannot
              # fail). SAFE AGAINST THE FR GATE: it ranks `Done` above `On dev`, so a
              # terminal card satisfies both gates (kanban-deploy-state-selftest.py).
              STATUS="Done"
            else
              # not_planned, or closed with no state_reason at all → abandoned.
              STATUS="Cancelled"
            fi
          else
            echo "Unexpected event '$EVENT_NAME' — skipping"
          fi

          # Grouped: three consecutive individual redirects trip SC2129, and
          # actionlint is a required check here.
          {
            echo "status=$STATUS"
            echo "sibling=$SIBLING"
            echo "unusable_override=$UNUSABLE_OVERRIDE"
          } >> "$GITHUB_OUTPUT"
          echo "Routing decision: status=${STATUS:-(unchanged)} sibling=$SIBLING unusable-override=$UNUSABLE_OVERRIDE"

      # The Status write runs BEFORE the label steps below, so a label failure can
      # never suppress the column write -- label-first skipped the update via the
      # implicit success() and left the card where the built-in automation put it
      # (Bugbot on (internal ref)). App token: caller permission sets vary.
      - name: Update Status on the kanban
        if: steps.target.outputs.status != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ 'tracebloc' }}
          PROJECT_NUMBER: ${{ 2 }}
          STATUS_NAME: ${{ steps.target.outputs.status }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          REPO_NAME="${REPO_FULL#*/}"

          # selftest:graphql-read-start  (the ONE line every GraphQL step carries; the function is scripts/lib/graphql-read.sh)
          . .org-config-tools/scripts/lib/graphql-read.sh
          # selftest:graphql-read-end

          # Look up project ID + Status field/option IDs
          # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
          PROJ=$(gh api graphql -f query='
            query($org: String!, $num: Int!) {
              organization(login: $org) {
                projectV2(number: $num) {
                  id
                  fields(first: 50) {
                    nodes {
                      ... on ProjectV2SingleSelectField { id name options { id name } }
                    }
                  }
                }
              }
            }' -F org="$ORG" -F num="$PROJECT_NUMBER")
          reject_graphql_errors "$PROJ" "project #$PROJECT_NUMBER field read" || exit 1

          PROJECT_ID=$(echo "$PROJ" | jq -r '.data.organization.projectV2.id')
          STATUS_FIELD=$(echo "$PROJ" | jq -r '.data.organization.projectV2.fields.nodes[]
            | select(.name=="Status") | .id')
          STATUS_OPT=$(echo "$PROJ" | jq -r --arg s "$STATUS_NAME" '.data.organization.projectV2.fields.nodes[]
            | select(.name=="Status") | .options[] | select(.name==$s) | .id')
          if [ -z "$STATUS_OPT" ] || [ "$STATUS_OPT" = "null" ]; then
            echo "Could not resolve Status option '$STATUS_NAME' — aborting"
            exit 1
          fi

          # Find item ID for this PR or issue
          if [ "$IS_PR" = "true" ]; then
            # shellcheck disable=SC2016  # $num is a GraphQL variable - must not expand in shell
            FIELD_QUERY='pullRequest(number: $num) { projectItems(first: 10) { nodes { id project { number } fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } } } } }'
          else
            # shellcheck disable=SC2016  # $num is a GraphQL variable - must not expand in shell
            FIELD_QUERY='issue(number: $num) { projectItems(first: 10) { nodes { id project { number } fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } } } } }'
          fi

          # Retry briefly to let auto-add fire. A FAILED LOOKUP IS NOT AN ABSENT
          # CARD (Bugbot on (internal ref)): a failed attempt is retried like a miss
          # but REMEMBERED, and if the LAST attempt failed the step fails instead
          # of skipping (kanban-item-lookup-selftest.py's router cases).
          LOOKUP_ERRF=$(mktemp)
          LOOKUP_ERR=""
          for i in 1 2 3 4 5; do
            LOOKUP_ERR=""
            # THE BODY DECIDES, WHATEVER THE EXIT CODE ((internal ref)): an exit-0
            # `errors[]` or non-JSON response is a failed attempt, retried and remembered.
            if ! RESP=$(gh api graphql -f query="
              query(\$org: String!, \$repo: String!, \$num: Int!) {
                repository(owner: \$org, name: \$repo) {
                  $FIELD_QUERY
                }
              }" -F org="$ORG" -F repo="$REPO_NAME" -F num="$NUMBER" 2>"$LOOKUP_ERRF") \
               || ! reject_graphql_errors "$RESP" "#$NUMBER project-item lookup" 2>>"$LOOKUP_ERRF"; then
              LOOKUP_ERR=$(sed 's/^::error:://' "$LOOKUP_ERRF" | tr '\n' ' ')
              LOOKUP_ERR="${LOOKUP_ERR:-gh exited non-zero with no message}"
              echo "::warning::#$NUMBER project-item lookup failed (attempt $i/5): $LOOKUP_ERR"
              ITEM_ID=""; CURRENT_COL=""
              sleep 5
              continue
            fi

            ITEM_ID=$(echo "$RESP" | jq -r --arg n "$PROJECT_NUMBER" '
              ([.. | objects | select(has("projectItems"))] | first).projectItems.nodes[]?
              | select(.project.number == ($n | tonumber)) | .id' | head -1)
            CURRENT_COL=$(echo "$RESP" | jq -r --arg n "$PROJECT_NUMBER" '
              ([.. | objects | select(has("projectItems"))] | first).projectItems.nodes[]?
              | select(.project.number == ($n | tonumber)) | .fieldValueByName.name // ""' | head -1)
            if [ -n "$ITEM_ID" ] && [ "$ITEM_ID" != "null" ]; then break; fi
            echo "Item not yet on project, retry $i/5..."
            sleep 5
          done

          if [ -z "$ITEM_ID" ] || [ "$ITEM_ID" = "null" ]; then
            if [ -n "$LOOKUP_ERR" ]; then
              echo "::error::#$NUMBER project-item lookup FAILED on the last attempt -- its board state is UNKNOWN, not absent, and Status=$STATUS_NAME was NOT written: $LOOKUP_ERR"
              exit 1
            fi
            echo "Item #$NUMBER not on project after 5 retries — skipping."
            exit 0
          fi

          # Done means "completed, nothing deployed" (D8), so it must never
          # overwrite a column that records a deployment: reopen, then hand-close
          # an issue sitting in a deploy column, and the deploy state would be gone
          # and the card archived (Bugbot on (internal ref)). Only Done is
          # guarded; a PR-derived Status is a deploy fact. WHICH COLUMNS ARE DEPLOY
          # STATES IS ASKED OF THE BOARD ((internal ref)): a hand-maintained list
          # rotted once ((internal ref)), so `$PROJ`'s Status options in
          # PIPELINE ORDER decide -- any column from "On dev" to "Prod" -- and an
          # inserted or renamed intermediate column needs no edit here. Two anchors,
          # both written by this workflow, so (internal ref)'s checker asserts them.
          col_index() {
            echo "$PROJ" | jq -r --arg s "$1" \
              '[.data.organization.projectV2.fields.nodes[]
                | select(.name=="Status") | .options[].name] | index($s) // -1'
          }
          # selftest:classify-start  (byte-identical in kanban-reconcile.yml)
          # Is this column a DEPLOY STATE? Answered from the board's own ORDER --
          # any column at or after "On dev" and at or before "Prod" -- so a column
          # INSERTED between them is classified correctly with no edit here
          # ((internal ref)). Only `col_index` differs between the two workflows,
          # because only their inputs differ; this decision must not.
          #
          #   yes      a deploy state
          #   no       not one -- including NO COLUMN AT ALL, which is evidence
          #            nothing deployed rather than a column we cannot place
          #   unknown  a column the board does not report
          #   noboard  the board's anchors are MISSING OR INVERTED, so nothing can
          #            be placed. Inverted counts as much as missing: this helper's
          #            whole thesis is that POSITION decides, which makes option
          #            ORDER load-bearing. Drag "Prod" above "On dev" and the range
          #            _d.._p is unsatisfiable, so EVERY column -- "Prod" itself
          #            included -- comes back `no`, the router writes Done over
          #            shipped state and reconcile asserts it. A reordered board is
          #            UNREADABLE, not evidence that nothing deployed, so it fails
          #            closed exactly like a missing anchor ((internal ref)).
          classify_column() {
            case "${1:-}" in
              ""|"No status") echo no; return ;;
            esac
            _c=$(col_index "$1"); _d=$(col_index "On dev"); _p=$(col_index "Prod")
            if [ "$_d" -lt 0 ] || [ "$_p" -lt 0 ] || [ "$_d" -gt "$_p" ]; then echo noboard; return; fi
            if [ "$_c" -lt 0 ]; then echo unknown; return; fi
            if [ "$_c" -ge "$_d" ] && [ "$_c" -le "$_p" ]; then echo yes; else echo no; fi
          }
          # selftest:classify-end
          if [ "$STATUS_NAME" = "Done" ]; then
            # UNKNOWN MUST NOT FALL OPEN -- the other half of (internal ref). A column this
            # workflow cannot place used to sail past the `case` and let Done erase
            # a deploy state. Refusing costs a card sitting where it is; falling
            # open erases the fact that it shipped.
            # selftest:policy-start
            _ds=$(classify_column "${CURRENT_COL:-}")
            case "$_ds" in
              noboard)
                echo "::error::the board's 'On dev'/'Prod' anchors are missing or out of order, so a deploy state cannot be recognised - refusing to set Done on #$NUMBER"
                exit 1 ;;
              unknown)
                echo "::notice::#$NUMBER sits in '${CURRENT_COL:-<unreadable>}', which this board does not report as a column - NOT setting Done rather than guessing"
                exit 0 ;;
              yes) _protect=yes ;;
              *)   _protect=no ;;
            esac
            # selftest:policy-end
            if [ "$_protect" = "yes" ]; then
              echo "::notice::#$NUMBER hand-closed but sits in '$CURRENT_COL', a deploy state - NOT setting Done (D8: follow the PR's stage)"
              # AND SAY SO WHERE SOMEONE WILL SEE IT. Refusing is right, but it
              # parks the card with no way to self-heal, and a run-log notice is
              # invisible by the time anyone looks at the board. The two real
              # cases needed OPPOSITE answers -- (internal ref) had shipped via
              # cli#452 and belonged in Prod; (internal ref) was reverted and
              # belonged in Done -- so no default is correct and only the person
              # closing it knows which.
                CLOSE_NOTE="Closed while the board still shows \`$CURRENT_COL\`, which records a deployment."
                CLOSE_NOTE="$CLOSE_NOTE The automation will not overwrite a deploy state with \`Done\` -- a standing board rule, not a glitch --"
                CLOSE_NOTE="$CLOSE_NOTE so this card stays where it is until someone says which happened:"
                CLOSE_NOTE="$CLOSE_NOTE **it shipped** - move the card to the column it reached (\`Prod\` if it is in production);"
                CLOSE_NOTE="$CLOSE_NOTE **nothing was deployed** (reverted, abandoned, superseded) - clear the deploy state, then \`Done\`."
                CLOSE_NOTE="$CLOSE_NOTE Both cases are real and they need opposite answers, which is why this is not decided automatically."
                gh issue comment "$NUMBER" --repo "$REPO_FULL" --body "$CLOSE_NOTE" >/dev/null 2>&1 \
                  || echo "::warning::could not comment on #$NUMBER - it is parked in '$CURRENT_COL' with no note on the issue"
              exit 0
            fi
          fi

          # THE WRITE'S BODY IS READ TOO: an exit-0 response carrying errors[] means
          # the Status was NOT written, and a refusal is a failed write ((internal ref)).
          # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
          WRESP=$(gh api graphql -f query='
            mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $p, itemId: $i, fieldId: $f,
                value: {singleSelectOptionId: $o}
              }) { projectV2Item { id } }
            }' -f p="$PROJECT_ID" -f i="$ITEM_ID" -f f="$STATUS_FIELD" -f o="$STATUS_OPT" 2>&1) \
            || { echo "::error::#$NUMBER Status=$STATUS_NAME write failed: $WRESP" >&2; exit 1; }
          reject_graphql_errors "$WRESP" "#$NUMBER Status=$STATUS_NAME write" || exit 1

          echo "→ #$NUMBER → Status=$STATUS_NAME"
      - name: Label a card whose override could not be used
        if: steps.target.outputs.unusable_override == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_FULL: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          # Same write rule as the sibling label below: a swallowed failure loses the
          # only marker saying this Status is a placeholder. `override-unusable`, not
          # `override-unreadable` ((internal ref)): a card reaches this state with a
          # `.kanban.yml` that read perfectly and named a missing column. Nothing to
          # migrate: the old label is carried by zero items org-wide ((internal ref);
          # do not add a clause about how many repos adopt the override -- no comment
          # can keep that true). KEEP THE DESCRIPTION UNDER 100 CHARACTERS, the label
          # API's cap (Bugbot on (internal ref)); the selftest measures it.
          if ! gh api "repos/$REPO_FULL/labels/override-unusable" >/dev/null 2>&1; then
            gh api "repos/$REPO_FULL/labels" -f name=override-unusable -f color=d4c5f9 -f description="Holding state: .kanban.yml unreadable, or names an undeclared Status" >/dev/null
          fi
          gh api -X POST "repos/$REPO_FULL/issues/$NUMBER/labels" -f "labels[]=override-unusable" >/dev/null

      - name: Label sibling-merged PR
        if: steps.target.outputs.sibling == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_FULL: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Write failures FAIL this step: a swallowed error means the card silently
          # loses its only visibility marker (Bugbot on (internal ref)). Only the
          # ensure-label probe may miss quietly -- a 404 there just means create it.
          if ! gh api "repos/$REPO_FULL/labels/sibling-merge" >/dev/null 2>&1; then
            gh api "repos/$REPO_FULL/labels" -f name=sibling-merge -f color=bfdadc -f description="Merged into a sibling feature branch; content ships via the parent PR" >/dev/null
          fi
          gh api -X POST "repos/$REPO_FULL/issues/$NUMBER/labels" -f "labels[]=sibling-merge" >/dev/null
