name: Commit hygiene

# A COPY, not a reusable (`copies:` in repo-inventory.yml, beside add-to-kanban.yml):
# the public content repos carry the public-safe render of this file under
# .github/workflows/, delivered by scripts/onboard_repo.py and content-asserted by
# scripts/caller-drift.py. Private repos keep this original. (internal ref),
# (internal ref).
#
# WHY THIS EXISTS. The org ruleset `content-repos-commit-hygiene` on the
# `exposure: content` repos refused customer names in commit messages by NAMING
# them in its regex -- and GitHub serves a public repo's branch rules to an
# anonymous reader, parameters included, so the names the org must never publish
# were published as the rule meant to keep them private. The regex is generic now
# (cross-repo `name#N`, org-qualified repo names, RFC ids), which left the tenant
# half with no enforcement. This workflow scans every commit of a pull request;
# the logic is scripts/commit-hygiene.py, this file is the wiring. It has TWO
# SHAPES, and the inventory's `visibility` picks which one a repo carries:
#
#   * THIS ORIGINAL (private repos) wires the tenant needles from the org secret
#     that also feeds the weekly anonymous exposure audit, parsed by
#     scripts/public_surface.py, and scans each message against them AND against
#     the internal-reference rule. A tenant hit is reported by the needle's NUMBER
#     only -- never the name, never the matched text.
#   * THE PUBLIC RENDER (scripts/render-self-contained.py) LEAVES THE NEEDLES OUT:
#     the wiring below sits in a `public-render: omit` region, so a public repo
#     receives neither the secret nor a line that names it. The needles are tenant
#     names, and a public repository's Actions runner is not where those belong.
#     The job there scans for INTERNAL REFERENCES only -- a private repo's issue
#     (`<repo>#N`), its org-qualified name, an RFC id -- derived from the
#     inventory in the tools checkout, and reports a hit by KIND, never by text.
#
# WHERE IT RUNS. Only where the commit log is a public surface: the job is gated
# on `github.event.repository.private == false`, so the private repo that holds
# this canonical skips it (a tenant name in a private commit log is nobody's
# business), and every public repo that carries the render runs it. Arm it as a
# required status check on the content repos' `develop` once it has been observed
# green there (CLAUDE.md rule 4: never land a red gate).
#
# FAIL CLOSED (CLAUDE.md rule 3), and the script says which way:
#   exit 0  every commit scanned, clean
#   exit 1  a hit -- `commit <sha7>: subject/body matches private needle #N`, or
#           `commit <sha7>: subject/body carries an internal reference (<kind>, ...)`
#   exit 2  could not tell: a fork head (no secrets), needles that are WIRED but
#           resolved EMPTY (the secret did not reach this repository -- the scan
#           did not run), a needle that does not compile, an inventory the rule
#           cannot be built from, more commits than GitHub's endpoint lists (250,
#           refused before any read), a list that does not match the event's
#           count, or a failed read.
# A fork PR is refused in the FIRST step below rather than by the script: the
# script is fetched from the tools repo with an App token minted from secrets a
# fork head does not receive, so on a fork the mint would fail first and the log
# would name a missing input instead of the cause. The script repeats the check
# for the shape where it is reached (HEAD_IS_FORK), and the suite proves that one.
#
# PULL-REQUEST-CONTROLLED INPUT NEVER REACHES A SHELL. The script reads the
# commit messages from the API into Python and matches them there; nothing from a
# commit message is interpolated into a command line or printed.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One run per pull request head: a new push makes the previous scan moot.
concurrency:
  group: commit-hygiene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `pull-requests: read` is what the one `gh api .../pulls/N/commits` read needs;
# `contents: read` is for nothing this workflow does in the calling repo (the
# tools checkout uses its own token) and is granted so `github.token` is not a
# zero-permission token, which some API paths reject outright.
permissions:
  contents: read
  pull-requests: read

jobs:
  commit-messages:
    name: hygiene / commit-messages
    # Public surfaces only -- see WHERE IT RUNS above. `github.event.repository`
    # is the repo the PR targets, which is the repo whose log is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      # The event facts the script holds the API read to. Read here, once, from
      # the payload -- not re-fetched -- so a PR the endpoint cannot list in full
      # is refused before any call is made.
      HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
      PR_COMMITS: ${{ github.event.pull_request.commits }}
    steps:
      - name: Refuse a fork head before the mint below fails on it
        if: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          echo "::error::commit hygiene: COULD NOT TELL -- the pull request head is a FORK, and a fork PR receives no secrets, so the tools repo cannot be checked out and the scan did not run. A maintainer reads the commit messages by hand before merging."
          exit 2

      # The checker lives in the tools repo, which is PRIVATE, so the checkout
      # needs a read-only App token -- the same mint every self-contained render
      # makes, scoped to that one repository and to `contents: read`.
      - name: Mint a read-only token for the tools repo
        id: org-config-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-config
          permission-contents: read

      # `main` is the ref every fleet caller pins the tools repo at; a copy has no
      # reusable commit to take instead.
      - name: Check out the shared checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/org-config
          token: ${{ steps.org-config-token.outputs.token }}
          ref: main
          path: .org-config-tools
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The checker builds the internal-reference rule from the inventory in that
      # checkout, which is parsed as YAML, not grepped -- the one dependency,
      # pinned as the exposure audit pins it. A failed install fails the job
      # before the scan step, never a scan against an unreadable inventory.
      - name: Install PyYAML
        run: python -m pip install --quiet --disable-pip-version-check 'pyyaml==6.0.2'

      # The scan reads the messages through `gh`, preinstalled on the runner. Which
      # checks run is read off the ENVIRONMENT'S KEYS, never its values: the tenant
      # needles are wired below in the private original and left out of the public
      # render, and the script scans tenants only where the key is present.
      - name: Scan the pull request's commit messages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .org-config-tools/scripts/commit-hygiene.py
