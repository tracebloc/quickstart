name: FR gate

# Reusable workflow. Called from each active repo on pull_request events
# targeting staging, main, or master. Blocks the merge unless every item
# included in the promotion is at or beyond the correct "Ready for X" column:
#
#   target = staging  → all items must be at "On dev" or later (automatic — D6)
#   target = main/master → all items must be at "Ready for prod" or later
#
# "or later": an item already further down the pipeline satisfies an earlier
# gate instead of being falsely blocked (`scripts/fr-gate-walk.sh` holds the
# stage order). A required status check via branch protection; the visible,
# audited override is the `skip-fr-gate` label. Items are discovered by
# commit->PR attribution (`commits/{sha}/pulls`) between base and head;
# (internal ref) promotion PRs are transparent plumbing; with no PRs found the
# promotion PR's own Status is checked (the walk script's `discover` mode).

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]
jobs:
  gate:
    name: gate / gate
    runs-on: ubuntu-slim
    # ubuntu-slim hard-caps a job at 15 minutes; a board read that takes longer
    # than this is a stuck read, and the cap would kill it without a message.
    timeout-minutes: 10
    steps:
      - name: Determine required Status from target branch
        id: target
        env:
          BASE: ${{ github.base_ref }}
        run: |
          case "$BASE" in
            staging)     echo "required=On dev" >> "$GITHUB_OUTPUT" ;;
            main|master) echo "required=Ready for prod"    >> "$GITHUB_OUTPUT" ;;
            *)           echo "required="                  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Skip if not promoting to staging/main/master
        if: steps.target.outputs.required == ''
        run: echo "Target branch '${{ github.base_ref }}' is not gated — nothing to enforce."

      - name: Check for skip-fr-gate label
        id: skip
        if: steps.target.outputs.required != ''
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q '"skip-fr-gate"'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::FR gate bypassed via 'skip-fr-gate' label."
            # (promotion-shape guard below is also bypassed by this label)
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Promotion-shape guard — only the train promotes
        if: steps.target.outputs.required != '' && steps.skip.outputs.skip != 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # Manual promotion PRs bypass the release train's Bugbot soft-gate,
          # its tagging, and its run records — and indirect-merge the train's
          # own PRs ((internal ref) / (internal ref), 2026-07-29). Promotions
          # into staging/main/master are the train's job. Sanctioned lanes:
          #   release-train/*       the train's own mirror PRs
          #   hotfix-backmerge/*    hotfix.yml's automated back-merges
          #   'hotfix' label        single-repo emergency fix (D14a, audited)
          #   'skip-fr-gate' label  full gate override (handled above, audited)
          case "$HEAD_REF" in
            release-train/*|hotfix-backmerge/*) exit 0 ;;
          esac
          if echo "$LABELS" | grep -q '"hotfix"'; then
            exit 0
          fi
          echo "::error::Manual promotion PRs are retired — promotions into this branch go through the org's release train (a maintainer dispatches its 'Release train' workflow). For a single-repo emergency prod fix use the 'hotfix' label; 'skip-fr-gate' remains the audited full override."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.required != '' && steps.skip.outputs.skip != 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # THE WALK LIVES HERE, NOT IN THE CALLING REPO ((internal ref), (internal ref) D6):
      # the release train needs the same walk to cut the prod hop at the FR
      # frontier, and a second copy would be the drift rule 9 forbids -- so the
      # script is checked out of this PRIVATE repo with a read-only App token,
      # supplied by every caller's `secrets: inherit`; `persist-credentials: false`
      # because the walk reads with the wider App token minted further below.
      - name: Mint a read-only token for org-config (private; the caller's own token cannot read it)
        id: org-config-token
        if: steps.target.outputs.required != '' && steps.skip.outputs.skip != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-config
          permission-contents: read

      # THE TOOLS REF ((internal ref) D4, (internal ref)): `job.workflow_sha` is the commit
      # of THIS reusable file, so the scripts below are the ones it was reviewed
      # with; `tools-ref` overrides it for a test. An EMPTY ref would check out the
      # tools repo's DEFAULT branch fleet-wide, so it is refused. `toJSON(job)` because
      # actionlint's `job` schema (1.7.12) does not know `workflow_sha`.
      - name: Resolve the tools ref, refusing an empty one
        id: tools-ref
        if: steps.target.outputs.required != '' && steps.skip.outputs.skip != 'true'
        env:
          TOOLS_REF: ${{ 'main' }}
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          if [ -z "$TOOLS_REF" ]; then
            case "$JOB_CONTEXT" in
              *'"workflow_sha"'*) TOOLS_REF="${JOB_CONTEXT#*\"workflow_sha\": \"}"; TOOLS_REF="${TOOLS_REF%%\"*}" ;;
            esac
          fi
          if ! [[ "$TOOLS_REF" =~ ^[0-9a-f]{40}$ || ( -n "$TOOLS_REF" && "$TOOLS_REF" != *[![:alnum:]._/-]* ) ]]; then
            echo "::error::the tools ref is empty or not a ref (${TOOLS_REF:-<empty>}); an empty ref would check out the tools repo's default branch instead of the commit this workflow was pinned at. Refusing."
            exit 1
          fi
          echo "ref=$TOOLS_REF" >> "$GITHUB_OUTPUT"
          echo "tools ref: $TOOLS_REF"
      - name: Check out the shared walk script
        if: steps.target.outputs.required != '' && steps.skip.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/org-config
          token: ${{ steps.org-config-token.outputs.token }}
          ref: ${{ 'main' }}
          path: .org-config-tools
          persist-credentials: false

      # Authenticates as the tracebloc-release-train App ((internal ref)), ORG-scoped
      # by `owner:` because it reads the org PROJECT. READ-ONLY: `commits/{sha}/pulls`,
      # `compare/{base}...{head}` and the ProjectV2 graphql; it never writes a card, a
      # label or a comment. Gated behind the same `if:` as the steps that use it, so
      # a skipped PR mints nothing. NO FALLBACK TO A PAT: this gate blocking wrongly
      # is far better than it passing wrongly.
      - name: Mint an installation token
        id: app-token
        if: steps.target.outputs.required != '' && steps.skip.outputs.skip != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # THREE READS AND NOTHING ELSE ((internal ref)), derived from the calls the
          # comment above names -- checked rather than guessed:
          #   commits/{sha}/pulls      -> contents: read + pull-requests: read
          #   compare/{base}...{head}  -> contents: read
          #   ProjectV2 graphql        -> organization-projects: read
          # The checkout above is on the job's GITHUB_TOKEN, not this token. IF THIS
          # SCOPE IS SHORT the gate fails closed and blocks promotions -- loud,
          # immediate and recoverable with the `skip-fr-gate` label, the failure
          # direction this gate already chose for itself.
          permission-contents: read
          permission-pull-requests: read
          permission-organization-projects: read

      - name: Discover items in this promotion
        id: items
        if: steps.target.outputs.required != '' && steps.skip.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_FULL: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Make the base branch tip available locally for the diff.
          git fetch origin "$BASE_REF":"refs/remotes/origin/$BASE_REF" --depth=200 2>/dev/null || true
          BASE_SHA=$(git rev-parse "origin/$BASE_REF")
          export BASE_SHA
          # Attribution, promotion-PR transparency, the two-pass merge handling
          # (Bugbot on (internal ref), (internal ref)) and the file count live
          # in the script, shared with the train; it writes prs= / unattributed= / changed_files=.
          bash .org-config-tools/scripts/fr-gate-walk.sh discover

      - name: Verify each item is in required Status
        if: steps.target.outputs.required != '' && steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ 'tracebloc' }}
          PROJECT_NUMBER: ${{ 2 }}
          REPO_FULL: ${{ github.repository }}
          REQUIRED: ${{ steps.target.outputs.required }}
          PRS: ${{ steps.items.outputs.prs }}
          UNATTRIB: ${{ steps.items.outputs.unattributed }}
          PROMOTION_PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ steps.items.outputs.changed_files }}
        run: |
          # The rank() ordering, resolve_status's race-aware retries and the
          # fail-closed verdict (blocked / missing / unreadable / unattributable
          # all block) are the script's `verify` mode. Same text, same exit code.
          bash .org-config-tools/scripts/fr-gate-walk.sh verify
