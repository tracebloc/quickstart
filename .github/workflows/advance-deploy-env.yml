        if: steps.env.outputs.env != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # LEAST PRIVILEGE, DERIVED FROM THIS JOB'S OWN CALLS ((internal ref)) --
          # the union of what the steps below need:
          #
          #   organization(login:).projectV2 field/option lookup   projects  read
          #   updateProjectV2ItemFieldValue                        projects  WRITE
          #   repository.pullRequest(n).projectItems               PRs       read
          #   GET /repos/{r}/commits/{sha}/pulls  (extract step)   PRs       read
          #                                                        contents  read
