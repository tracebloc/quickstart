            # unknown case: an empty value is a card the board has not placed
            # yet, and writing one is what the "no card sits at No Status"
            # invariant depends on. A NON-EMPTY name the order cannot place is
            # the unknown case, and it refuses (see RANK_TOOL above).
            CURRENT_RANK=0
            if [ -n "$CURRENT_STATUS" ] && ! CURRENT_RANK=$(rank "$CURRENT_STATUS"); then
              echo "::error::#$prnum sits in '$CURRENT_STATUS', which has no place in the pipeline order, so Status=$STATUS_NAME cannot be shown to be an ADVANCE -- the card was NOT touched"
              RUN_FAILED=1
              continue
            fi
            if [ "$CURRENT_RANK" -ge "$TARGET_RANK" ]; then
              echo "::notice::#$prnum already at '${CURRENT_STATUS:-none}' (>= '$STATUS_NAME') -- not demoting"
              continue
            fi

            echo "-> PR #$prnum: Deploy env = $DEPLOY_ENV"
            update_field "$DEPLOY_FIELD" "$DEPLOY_OPT" "Deploy env=$DEPLOY_ENV"

            if [ "$SKIP_STATUS" != "1" ]; then
              echo "-> PR #$prnum: Status = $STATUS_NAME"
              update_field "$STATUS_FIELD" "$STATUS_OPT" "Status=$STATUS_NAME"
            fi
          done

          # NO ISSUE ADVANCEMENT HERE. This workflow advances PRs only: a completed
          # issue goes straight to `Done` in kanban-closure-router.yml ((internal ref)),
          # which is terminal and archived daily, so nothing is left to drift --
          # the answer to (internal ref), whose remedy (marching the card through the
          # deploy columns) this block would undo if kept. What the removed loop
          # did, should issue advancement ever be needed again:
          # the removed loop resolved closingIssuesReferences CROSS-REPO, failed CLOSED
          # on a lookup error ((internal ref)), skipped a non-PR number quietly
          # ((internal ref)) and refused a still-OPEN closing issue ((internal ref)).

          # BOTH COUNTERS FAIL THE STEP, after every PR in the push has had its
          # turn. A red run is the only signal a stranded card gets; advancement
          # is monotonic, so re-running this workflow once the API error has
          # cleared is safe and is the remedy.
          if [ "$LOOKUP_FAILED" -ne 0 ]; then
            echo "::error::$LOOKUP_FAILED PR lookup(s) FAILED (see the errors above) -- those cards may sit behind their shipped code; re-run this workflow once the API error has cleared."
          fi
          if [ "$RUN_FAILED" -ne 0 ]; then
            echo "::error::One or more project items failed to update (see warnings above)."
          fi
          if [ "$LOOKUP_FAILED" -ne 0 ] || [ "$RUN_FAILED" -ne 0 ]; then
            exit 1
          fi
