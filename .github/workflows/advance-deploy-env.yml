          # card FORWARD, because back-merges and fast-forwards re-push commits
          # that already shipped (seen live: (internal ref) to (internal ref)
          # and (internal ref)). THE ORDER ITSELF lives in `scripts/pipeline_rank.sh`
          # in the checkout above, the one declaration set-pr-status.yml shares
          # ((internal ref); pipeline-rank-selftest.py holds every column of it).
          # THE UNKNOWN POLICY IS THIS WORKFLOW'S: the table refuses a name it does
          # not know rather than ranking it below everything -- which is how `Done`
          # and `Cancelled` were demoted before they were ranked ((internal ref)) --
          # and an unplaceable Status skips that ITEM and fails the step at the end.
          RANK_TOOL=".org-config-tools/scripts/pipeline_rank.sh"
          rank() { bash "$RANK_TOOL" "$1"; }
          if ! TARGET_RANK=$(rank "$STATUS_NAME"); then
            echo "::error::Status '$STATUS_NAME' has no place in the pipeline order," \
                 "so no card can be shown to be advancing rather than demoting." \
                 "NOTHING WAS WRITTEN." >&2
            exit 1
          fi

          # One bad item must not abort the whole push: an unguarded mutation under
          # `set -e` would leave every later PR un-advanced, so a per-item error is
          # logged, flags the run, and the loop goes on.
