          # `contents: read` IS FOR THE EXTRACT STEP'S `/pulls` CALL, NOT THE
          # MAPPER'S ((internal ref)): the mapper runs BEFORE this mint under
          # `github.token`, so it was never a reason to grant contents
          # ((internal ref)) -- read the call site, not the prose, before
          # dropping or widening a scope. `repositories:` stays unnarrowed:
          # `organization-projects` is an org-level grant either way, and narrowing
          # is a token-scope change that wants its own measurement. No `issues`
          # scope: nothing here touches an issue since (internal ref). Scopes are
          # what the calls DOCUMENT, not what a run has proven -- an under-scoped
          # token fails at the call, as a card left behind its shipped code.
