              echo "[DRY] would set $3 on item $ITEM_ID"
              return 0
            fi
            # THE WRITE'S BODY IS READ TOO: an exit-0 mutation response carrying
            # errors[] means the field was NOT written ((internal ref); same rule as the reads).
