name: Naming guard

# Reusable workflow ((internal ref), epic (internal ref), (internal ref)): a pull
# request may not ADD an env name the naming canon has not recorded -- an unprefixed name we
# would own, or one under a banned prefix (TB_, CLIENT_, ...) -- nor a legacy spelling of an
# `enforced` form on its own. backend has had its own settings guard since
# (internal ref); the other repos had nothing, and (internal ref) gained ~29 new TB_
# names in a week (the canon's fourteenth pass, the private source repo).
# `scripts/naming-lint.py --diff-base` carries the decision and its reasoning (its module
# docstring, "THE DIFF MODE"); this file is the wiring, and says only what the script cannot.
#
# WHAT GOES RED, AND WHAT IS GRANDFATHERED. Only what the PR INTRODUCES is judged: a name on
# a line the PR adds, which the file now names more often than its merge base did. A name
# already there -- every grandfathered alias, every pre-existing unrecorded name, a legacy
# spelling past its `remove_by` -- never reds a PR that did not add it, and a line that only
# changes a value introduces nothing. Red, by name and line, with the canonical to use:
#   * a new unrecorded unprefixed name on the repo's product surface (the canon's
#     `env_prefix.plumbing` keeps CI-local, test and tooling paths out, unchanged), or a new
#     banned-prefix name anywhere;
#   * a new legacy spelling of an `enforced` form in a file that does not also name its
#     canonical (beside the canonical it is the alias-first read or dual-emit, and reports).
# A genuinely external name (an SDK's, a tool's) is recorded under `env_prefix.exemptions` in
# naming-canon.yml here, and passes once that canon is on `main` -- the canon is read from
# THIS checkout (`tools-ref`), never from the calling repo.
#
# IT IS MEANT TO BE REQUIRED, LATER. ARMING IS FOUR STEPS, IN THIS ORDER: (1) this file
# reaches `main` -- every caller pins `@main`, so a caller added first dies with
# `startup_failure`; (2) the canonical caller lands in the private source repo and the fleet's are
# generated from it with scripts/onboard_repo.py (`--steps target-pr --deliver-only
# .github/workflows/naming-guard-caller.yml`), one PR per repo, and model-zoo and quickstart
# receive the rendered copy -- the check is ADVICE, red where it finds something and
# required nowhere (an optional red holds no PR: scripts/one-rule-for-reds.json); each
# repo's inventory row flips to `required` after its caller merges (caller first, row
# after); (3) at least ONE WEEK of its runs fleet-wide is read, every red named: a red that was a real new
# name stays, a red that was noise is fixed in the script or the canon before arming -- a
# guard that cries wolf is switched off; (4) a person adds `naming / check` to each repo's
# protected branch (`develop`, or the default branch off the train), pinned to the GitHub
