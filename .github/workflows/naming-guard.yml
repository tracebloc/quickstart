#   pull_request: [opened, synchronize, reopened, ready_for_review] -- a new head needs a run
#                 of its own, or the context is missing on it once required;
#   merge_group:  -- FROM DAY ONE, on every repo (it never fires where no merge queue runs):
#                 a required context must report on the queue's commit or the queue removes
#                 the PR with `checks_timed_out` ((internal ref)). The queue commit is
#                 judged like a PR head, against `merge_group.base_sha`, so it re-runs the
#                 same verdict on what the queue is about to merge;
#   jobs: naming: uses: this file -- `naming` plus this job's `check` is the context name,
#   `naming / check`, that branch protection keys on at step 4.
# NO `paths:` OR `branches:` FILTER in a caller: a filtered required check never reports on
