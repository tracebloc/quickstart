on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:

permissions:
  contents: read

# THE DIFF BASE, DECLARED ONCE, code-quality.yml's expression ((internal ref)): the
# pull request's base where there is one, the merge group's where there is not. Both absent
# (an event this workflow is not meant for) is EMPTY, and the run step refuses on it -- a
# change set with no base cannot be judged, and judging the whole tree would red every PR
# for names it never added.
env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

jobs:
  check:
    name: naming / check
    # `ubuntu-slim` ((internal ref)): one mint, two checkouts, one pure-Python scan
    # of a PR's changed files -- a one-minute job, under the slim cap's 15.
    runs-on: ubuntu-slim  # runner: hosted (ubuntu-slim)
    timeout-minutes: 10
    steps:
      # FULL HISTORY: the script diffs the head against the merge base of BASE_SHA and HEAD,
      # and reads each changed file's base text from it. A shallow clone has neither, and
      # the script refuses rather than guessing.
      - name: Check out the change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Mint a read-only token for org-config (private; the caller's own token cannot read it)
        id: tools-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-config
          permission-contents: read

      # THE TOOLS REF ((internal ref) D4, (internal ref)): `job.workflow_sha` is the commit of
      # THIS reusable file, so the script and the canon are the ones it was reviewed with;
      # `tools-ref` overrides it for a test. An EMPTY ref would check out the tools repo's
      # DEFAULT branch fleet-wide, so it is refused. `toJSON(job)` because actionlint's `job`
      # schema (1.7.12) does not know `workflow_sha`.
      - name: Resolve the tools ref, refusing an empty one
        id: tools-ref
        env:
          TOOLS_REF: ${{ 'main' }}
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          if [ -z "$TOOLS_REF" ]; then
            case "$JOB_CONTEXT" in
              *'"workflow_sha"'*) TOOLS_REF="${JOB_CONTEXT#*\"workflow_sha\": \"}"; TOOLS_REF="${TOOLS_REF%%\"*}" ;;
            esac
          fi
          if ! [[ "$TOOLS_REF" =~ ^[0-9a-f]{40}$ || ( -n "$TOOLS_REF" && "$TOOLS_REF" != *[![:alnum:]._/-]* ) ]]; then
            echo "::error::the tools ref is empty or not a ref (${TOOLS_REF:-<empty>}); an empty ref would check out the tools repo's default branch instead of the commit this workflow was pinned at. Refusing."
            exit 1
          fi
          echo "ref=$TOOLS_REF" >> "$GITHUB_OUTPUT"
          echo "tools ref: $TOOLS_REF"
      # Into the workspace, UNTRACKED there, so the change set the script reads from git
      # never contains it.
      - name: Check out the checker and the canon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/org-config
          token: ${{ steps.tools-token.outputs.token }}
          ref: ${{ 'main' }}
          path: .org-config-tools
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # PyYAML, pinned: the canon is YAML, and the script refuses without it.
      - name: Install PyYAML for the canon read
        run: python -m pip install --quiet --disable-pip-version-check 'pyyaml==6.0.2'

      # `--repo` is this repository's name, for the canon's per-repo scopes (`repos:`,
      # `exclude_paths:`, `product_paths:`); `--repo-root` places every file under it. No
      # PR-controlled string is interpolated into this shell: the script reads the change
      # set from git itself.
      - name: Judge what this change introduces
        run: |
          set -uo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "::error::no base to diff against (neither pull_request.base.sha nor merge_group.base_sha is in the payload of a '$GITHUB_EVENT_NAME' event) -- this check judges what a change introduces, and cannot tell without one. Refusing."
            exit 1
          fi
          python3 .org-config-tools/scripts/naming-lint.py \
            --canon-root .org-config-tools \
            --diff-base "$BASE_SHA" --unknown --fail \
            --repo "${GITHUB_REPOSITORY#*/}" --repo-root "$GITHUB_WORKSPACE"
