name: FR pass comment handler

# Reusable workflow. Called from each active repo on issue_comment created.
# Listens for "/fr-pass" comments on PRs/issues that are currently in
# "FR on staging" and advances them one column:
#   FR on staging  →  Ready for prod
# (D6: the dev-side review is gone — "On dev" is automatic — so /fr-pass only
#  applies at staging, the single functional-review gate.)
#
# NEVER NO-OP IN SILENCE ((internal ref)): every terminating path leaves a signal
#   on the thread -- 👍 when the card moved, 👎 plus a one-paragraph comment when
#   it did not. The one exception is a comment that merely *mentions* the string
#   without issuing the command (a quoted reply, an inline mention, a log line
#   inside a code fence -- (internal ref)); what counts as issuing it is defined in
#   exactly one place, the `# selftest:fr-pass-command-*` region below. Hence no
#   decision may live in the job-level `if`: a false job `if` skips every step,
#   leaving nothing to react or comment with.
#
# A REFUSAL IS NOT A SUCCESS ((internal ref)): exactly three outcomes exit 0 --
#   `advanced`, `already-advanced`, `not-a-command`. Every other path exits 1,
#   including the handler correctly declining to move the card, because `gh run
#   list` is the only place anyone reads many threads at once and green there
#   must mean "the card moved". The 👎 and its note stay the real explanation.
#
# WHY A COMMENT GATE: it leaves a record on the thread of who passed FR and
#   when. Dragging the card on the kanban works too — this is the shortcut.

on:
  issue_comment:
    types: [created]

# GITHUB_TOKEN stays read-only and is NOT used for any write: the org default is
# `default_workflow_permissions: read`, and a called workflow can only narrow the
# caller's token, never widen it, so a `permissions: issues: write` here would be
# silently ineffective -- which is how the 👍/👎 reaction once 403'd on every run
# ((internal ref)). All writes use the App token the first step mints, and there is
# no GITHUB_TOKEN fallback on them: it would be dead code logging a misleading retry.
permissions:
  contents: read

jobs:
  advance:
    name: advance / advance
    # The job-level conditions are a cheap "is this even about /fr-pass" filter
    # and nothing more; no decision lives here (see NEVER NO-OP IN SILENCE).
    # The first is deliberately loose -- contains() is a case-insensitive
    # substring test -- because a comment that gets in but is not the command
    # exits silently from the first step, while a genuine command that never
    # gets in can never be reported. The other two stop this handler answering
    # itself ((internal ref): every refusal note contains the literal `/fr-pass`,
    # and 6 of 26 runs one day were the bot reading its own comment):
    #   * Not a bot account -- the handler's own notes arrive under the App's
    #     `[bot]` login, keyed on account type rather than a login so the busiest
    #     human reviewer is never locked out.
    #   * Not one of our own notes -- the marker the reporting step prepends to
    #     every note; startsWith, so a human who quotes a refusal ("> ...") and
    #     issues the command underneath is still heard.
    if: >-
      contains(github.event.comment.body, '/fr-pass')
      && github.event.comment.user.type != 'Bot'
      && !startsWith(github.event.comment.body, '<!-- fr-pass-handler -->')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # Authenticates as the tracebloc-release-train App ((internal ref)), ORG-scoped
      # by `owner:` (a repo-scoped token cannot reach an org ProjectV2), with no
      # fallback to a PAT (it would let a broken App path look like a working migration).
      - name: Mint an installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # LEAST PRIVILEGE, DERIVED FROM THIS JOB'S OWN CALLS ((internal ref)).
          # Two steps share this token and between them make six calls; this is the
          # union, with the permission each one documents:
          #
          #   GET repos/{r}/collaborators/{u}/permission   Metadata read (implicit)
          #   GET repos/{r}/pulls/{n}                      PRs read
          #   organization().projectV2 + item Status read   projects read
          #   updateProjectV2ItemFieldValue                projects WRITE
          #   POST issues/comments/{id}/reactions          Issues write AND PRs write
          #   POST issues/{n}/comments                     Issues write (or PRs write)
          #
          # `pull-requests: write`, AND THE REASON IS MEASURED ((internal ref)): when
          # the comment hangs off a pull request GitHub gates the reaction on
          # `pull_requests`, not `issues`, so with `read` here every real invocation
          # advanced the card and then died posting the thumb. The installation has
          # granted it since 2026-09-15; the ceiling was this file's. `Metadata` is
          # implicit with any repository permission; if the collaborator read fails
          # anyway the step falls back to `author_association`, a LOOSER test, so a
          # "Could not read repository permission" warning is a regression here, not
          # noise. Nothing reads or writes repository content, so contents drops.
          permission-issues: write
          permission-pull-requests: write
          permission-organization-projects: write

      # THE SHARED GraphQL GUARD, `scripts/lib/graphql-read.sh`, is sourced by the
      # step below after this checkout -- the three steps every reusable makes
      # ((internal ref) D4; (internal ref), (internal ref)).
      - name: Mint a read-only token for org-config (private; the caller's own token cannot read it)
        id: org-config-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-config
          permission-contents: read

      # THE TOOLS REF ((internal ref) D4, (internal ref)): `job.workflow_sha` is the commit
      # of THIS reusable file, so the scripts below are the ones it was reviewed
      # with; `tools-ref` overrides it for a test. An EMPTY ref would check out the
      # tools repo's DEFAULT branch fleet-wide, so it is refused. `toJSON(job)` because
      # actionlint's `job` schema (1.7.12) does not know `workflow_sha`.
      - name: Resolve the tools ref, refusing an empty one
        id: tools-ref
        env:
          TOOLS_REF: ${{ 'main' }}
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          if [ -z "$TOOLS_REF" ]; then
            case "$JOB_CONTEXT" in
              *'"workflow_sha"'*) TOOLS_REF="${JOB_CONTEXT#*\"workflow_sha\": \"}"; TOOLS_REF="${TOOLS_REF%%\"*}" ;;
            esac
          fi
          if ! [[ "$TOOLS_REF" =~ ^[0-9a-f]{40}$ || ( -n "$TOOLS_REF" && "$TOOLS_REF" != *[![:alnum:]._/-]* ) ]]; then
            echo "::error::the tools ref is empty or not a ref (${TOOLS_REF:-<empty>}); an empty ref would check out the tools repo's default branch instead of the commit this workflow was pinned at. Refusing."
            exit 1
          fi
          echo "ref=$TOOLS_REF" >> "$GITHUB_OUTPUT"
          echo "tools ref: $TOOLS_REF"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/org-config
          token: ${{ steps.org-config-token.outputs.token }}
          ref: ${{ 'main' }}
          path: .org-config-tools
          persist-credentials: false

      - name: Decide the outcome and advance the card
        id: assess
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ 'tracebloc' }}
          PROJECT_NUMBER: ${{ 2 }}
          ALLOW_SELF_SIGNOFF: ${{ true }}
          REPO_FULL: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          ITEM_AUTHOR: ${{ github.event.issue.user.login }}
          ACTOR: ${{ github.event.comment.user.login }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          # Via the environment, never interpolated into the script: a comment
          # body is attacker-controlled text and must not reach the shell parser.
          COMMENT_BODY: ${{ github.event.comment.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOARD_URL: ${{ github.server_url }}/orgs/${{ 'tracebloc' }}/projects/${{ 2 }}
        run: |
          set -euo pipefail
          # selftest:graphql-read-start  (the ONE line every GraphQL step carries; the function is scripts/lib/graphql-read.sh)
          . .org-config-tools/scripts/lib/graphql-read.sh
          # selftest:graphql-read-end

          RESULT_FILE="$RUNNER_TEMP/fr-pass.result"
          NOTE_FILE="$RUNNER_TEMP/fr-pass.note.md"
          : > "$RESULT_FILE"
          : > "$NOTE_FILE"

          # A literal ``` fence, kept in a variable so no backtick ever has to be
          # escaped inside a command substitution below.
          FENCE='```'

          # Publish an outcome on EVERY exit, including an unplanned one. The
          # reporting step keys off this one output, so a crash halfway through
          # (API error, jq error, a `set -e` trip) still produces a 👎 and an
          # explanation rather than the silence reported in (internal ref).
          publish() {
            if [ ! -s "$RESULT_FILE" ]; then
              printf 'internal-error' > "$RESULT_FILE"
              printf '%s\n' \
                "⚠️ \`/fr-pass\` failed before it could decide anything, so the card was **not** moved." \
                "" \
                "This is a bug in the handler, not something you did. Run log: $RUN_URL" > "$NOTE_FILE"
            fi
            echo "result=$(cat "$RESULT_FILE")" >> "$GITHUB_OUTPUT"
          }
          trap publish EXIT

          # decide <result> [note-line...] — record the outcome, plus the comment
          # to post with it. No note lines = react only, no thread comment.
          decide() {
            printf '%s' "$1" > "$RESULT_FILE"
            shift
            if [ "$#" -gt 0 ]; then
              printf '%s\n' "$@" > "$NOTE_FILE"
            fi
          }

          # ------------------------------------------------ 1. is it a command?
          # selftest:fr-pass-command-start
          # WHAT COUNTS AS ISSUING THE COMMAND — the ONE definition. It is
          # extracted from this file and executed by
          # scripts/tests/fr-pass-command-selftest.py, which never re-implements
          # the rule (CLAUDE.md rules 1 and 9): a change here is judged there.
          #
          # /fr-pass must be the first token on some line, AND that line must not
          # sit inside a fenced code block. Leading whitespace and trailing text
          # are fine; a quoted reply ("> /fr-pass") and an inline mention
          # ("you can `/fr-pass` it later") are not the command.
          #
          # THE FENCE RULE EXISTS BECAUSE WRITING ABOUT THE FEATURE FIRED IT
          # ((internal ref)). (internal ref) comment 5711673072 quoted this handler's
          # own happy-path line inside a ``` fence:
          #     /fr-pass → advanced (reacted +1)   (run 35200667821, 08:37Z)
          # A quoted log line starts at column 0 by construction, so the
          # start-of-line rule alone cannot tell it from a typed command. Runs
          # 35202152157 and 35202154005 both decided `wrong-column`, put a 👎 on a
          # human's status note and exited 1. Two of the eight `FR pass comment`
          # failures anyone would count to judge whether /fr-pass is healthy were
          # that — a 25% error in the number, caused by prose.
          #
          # AN UNCLOSED FENCE SWALLOWS THE REST OF THE BODY, DELIBERATELY. The
          # two directions are not symmetrical, so "cannot tell whether this line
          # is code" resolves to NOT a command: a missed command is a silent
          # no-op the author retries the moment no 👍 appears, while a spurious
          # one reacts 👎 on someone else's prose, posts a refusal note and
          # reddens a run that means nothing. Fail toward silence.
          #
          # Fence grammar, per CommonMark, because a narrower rule is the bug:
          #   * three or more backticks OR three or more tildes open a block,
          #     indented up to three blanks (at four it is an indented code block
          #     and the marks are literal text, not a fence);
          #   * the closer uses the SAME character, is at least as long as the
          #     opener and carries nothing but blanks — which is exactly what
          #     makes a ``` line inside a ```` block content and not a closer;
          #   * an opener may carry an info string (```bash), a closer may not.
          # NOT stripped, on purpose: a four-space indented code block (that is
          # also how a command gets indented under a list item, so stripping it
          # would disarm the feature) and HTML <pre>. Neither has been measured
          # firing this handler; the fence has.
          strip_fenced_blocks() {
            local line fence="" marks open_re close_re
            # Single-quoted, and matched through a variable so the marks are
            # regex to bash rather than text to quote-escape.
            open_re='^[[:blank:]]{0,3}(`{3,}|~{3,})'
            close_re='^[[:blank:]]{0,3}(`{3,}|~{3,})[[:blank:]]*$'
            while IFS= read -r line || [ -n "$line" ]; do
              if [ -z "$fence" ]; then
                if [[ "$line" =~ $open_re ]]; then
                  fence="${BASH_REMATCH[1]}"
                  continue
                fi
                printf '%s\n' "$line"
                continue
              fi
              # Inside a block: every line is dropped, including the closer.
              if [[ "$line" =~ $close_re ]]; then
                marks="${BASH_REMATCH[1]}"
                if [ "${marks:0:1}" = "${fence:0:1}" ] && [ "${#marks}" -ge "${#fence}" ]; then
                  fence=""
                fi
              fi
            done
          }

          # $1 = path to the comment body; exit 0 when that body ISSUES the
          # command. The stripped body is captured rather than piped into
          # `grep -q`: under errexit+pipefail a producer whose reader closes
          # early takes SIGPIPE, the pipeline returns 141, and a body big enough
          # to fill the pipe buffer would read as "not a command" — the class
          # scripts/pipefail-early-close.sh exists for.
          issues_fr_pass_command() {
            local visible
            visible=$(strip_fenced_blocks < "$1")
            grep -qiE '^[[:space:]]*/fr-pass([[:space:]].*)?$' <<< "$visible"
          }
          # selftest:fr-pass-command-end

          BODY_FILE="$RUNNER_TEMP/fr-pass.body"
          printf '%s' "$COMMENT_BODY" | tr -d '\r' > "$BODY_FILE"
          if ! issues_fr_pass_command "$BODY_FILE"; then
            echo "Body mentions /fr-pass but does not issue it as a command (an inline mention, a quoted reply, or inside a code fence) — staying silent by design."
            decide not-a-command
            exit 0
          fi

          # --------------------------------------------- 2. may they sign off?
          # author_association is not a permission check: a member whose org
          # membership is private reads as CONTRIBUTOR (or NONE) on repos they
          # were not added to individually, so the old MEMBER/OWNER test would
          # silently reject a real reviewer. Ask for the actual repository
          # permission, which also states D30's intent — "not a triage/read
          # outside collaborator" — directly instead of approximating it.
          PERM_ERR="$RUNNER_TEMP/fr-pass.perm.err"
          PERM_JSON=$(gh api "repos/$REPO_FULL/collaborators/$ACTOR/permission" 2> "$PERM_ERR") || PERM_JSON=""
          PERM=$(printf '%s' "$PERM_JSON" | jq -r '.permission // empty' 2> /dev/null || true)
          ROLE=$(printf '%s' "$PERM_JSON" | jq -r '.role_name // empty' 2> /dev/null || true)

          AUTHORISED=false
          case "$PERM" in admin | maintain | write) AUTHORISED=true ;; esac
          case "$ROLE" in admin | maintain | write) AUTHORISED=true ;; esac

          if [ -z "$PERM_JSON" ]; then
            # API unreachable (scope, rate limit, outage). Fall back to the
            # association rather than reject a legitimate reviewer — and say so.
            echo "::warning::Could not read repository permission for @$ACTOR — falling back to author_association=$ASSOCIATION"
            sed -n '1,3p' "$PERM_ERR"
            case "$ASSOCIATION" in MEMBER | OWNER | COLLABORATOR) AUTHORISED=true ;; esac
          fi

          if [ "$AUTHORISED" != "true" ]; then
            decide not-authorised \
              "🚫 \`/fr-pass\` was **not** applied: @$ACTOR does not have write access to \`$REPO_FULL\`." \
              "" \
              "Functional sign-off is limited to people who can write to the repository (seen: permission \`${PERM:-unknown}\`, association \`$ASSOCIATION\`). Ask someone on the team to sign off, or move the card by hand on the [engineering kanban]($BOARD_URL)."
            exit 1
          fi

          # -------------------------- 3a. is this a (internal ref) promotion?
          # Promotion PRs (`release-train/*`, and hotfix back-merges) are
          # plumbing: the FR gate on them evaluates the CONTAINED items, so the
          # promotion PR itself has nothing for a second reviewer to assess and
          # D30 would only block the train on its own author. The comment event
          # carries no branch refs, so look them up; FAIL CLOSED — an
          # unreadable PR is treated as normal work and keeps the D30 rule.
          IS_PROMOTION=false
          if [ "$IS_PR" = "true" ]; then
            if REFS=$(gh api "repos/$REPO_FULL/pulls/$NUMBER" \
                        --jq '[.head.ref, .base.ref] | @tsv' 2>/dev/null); then
              HEAD_REF=$(printf '%s' "$REFS" | cut -f1)
              BASE_REF=$(printf '%s' "$REFS" | cut -f2)
              case "$HEAD_REF" in
                release-train/* | hotfix-backmerge/*)
                  # Belt and braces: those heads only ever target an
                  # integration branch, so require that too.
                  case "$BASE_REF" in
                    staging | main | master) IS_PROMOTION=true ;;
                  esac
                  ;;
              esac
            else
              echo "Could not read the PR refs for #$NUMBER; treating it as normal work (D30 stays in force)."
            fi
          fi

          # ----------------------------------------- 3. self sign-off (D30)
          # THE bug from (internal ref) lived here, as a clause in the job-level `if`:
          # a self-signoff skipped the whole job, so nothing was left to react or
          # explain. The rule is unchanged; it now says so out loud.
          if [ "$ACTOR" = "$ITEM_AUTHOR" ] \
             && [ "$ALLOW_SELF_SIGNOFF" != "true" ] \
             && [ "$IS_PROMOTION" != "true" ]; then
            decide self-signoff \
              "👀 \`/fr-pass\` was **not** applied: functional review needs a second pair of eyes, and @$ACTOR opened this one (D30)." \
              "" \
              "Ask another team member to comment \`/fr-pass\`, or move the card to **Ready for prod** on the [engineering kanban]($BOARD_URL) if you are deliberately overriding the rule." \
              "" \
              "_Release-train promotion PRs are exempt from this rule automatically. To allow self sign-off on everything org-wide, set \`allow-self-signoff: true\` on \`fr-pass-comment.yml\`._"
            exit 1
          fi

          # ----------------------------------------- 4. resolve the board item
          REPO_NAME="${REPO_FULL#*/}"

          # One query, two roots: project metadata + this item's Status.
          # $itemNum names the issue/PR number so it stays distinct from $num.
          if [ "$IS_PR" = "true" ]; then
            # shellcheck disable=SC2016  # $itemNum is a GraphQL variable - must not expand in shell
            CONTENT_QUERY='pullRequest(number: $itemNum)'
          else
            # shellcheck disable=SC2016  # $itemNum is a GraphQL variable - must not expand in shell
            CONTENT_QUERY='issue(number: $itemNum)'
          fi

          GQL_ERR="$RUNNER_TEMP/fr-pass.gql.err"
          # No `2>/dev/null || PROJ='{}'` here. Swallowing the error made an
          # expired token, a rate limit and a genuinely unlisted card all produce
          # the same "not on project" 👎 — undiagnosable from the thread.
          if ! PROJ=$(gh api graphql -f query="
            query(\$org: String!, \$num: Int!, \$repo: String!, \$itemNum: Int!) {
              organization(login: \$org) {
                projectV2(number: \$num) {
                  id
                  field(name: \"Status\") {
                    ... on ProjectV2SingleSelectField { id options { id name } }
                  }
                }
              }
              repository(owner: \$org, name: \$repo) {
                $CONTENT_QUERY {
                  projectItems(first: 20) {
                    totalCount
                    nodes {
                      id
                      project { number }
                      fieldValueByName(name: \"Status\") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                    }
                  }
                }
              }
            }" -F org="$ORG" -F num="$PROJECT_NUMBER" -F repo="$REPO_NAME" -F itemNum="$NUMBER" 2> "$GQL_ERR"); then
            GQL_HEAD=$(sed -n '1,5p' "$GQL_ERR" | tr -d "$FENCE")
            decide api-error \
              "⚠️ \`/fr-pass\` could **not** be applied: the kanban API call failed, so the card was left alone." \
              "" \
              "$FENCE" \
              "$GQL_HEAD" \
              "$FENCE" \
              "" \
              "Usually a transient GitHub error, or the App installation has lost its organization-projects grant. Re-comment \`/fr-pass\` to retry. Run log: $RUN_URL"
            exit 1
          fi

          GQL_ERRORS=$(printf '%s' "$PROJ" | jq -r '(.errors // []) | map(.message) | join("; ")')
          PROJECT_ID=$(printf '%s' "$PROJ" | jq -r '.data.organization.projectV2.id // empty')
          STATUS_FIELD=$(printf '%s' "$PROJ" | jq -r '.data.organization.projectV2.field.id // empty')

          if [ -n "$GQL_ERRORS" ] || [ -z "$PROJECT_ID" ] || [ -z "$STATUS_FIELD" ]; then
            decide api-error \
              "⚠️ \`/fr-pass\` could **not** be applied: project #$PROJECT_NUMBER or its \`Status\` field did not resolve, so the card was left alone." \
              "" \
              "GraphQL said: \`${GQL_ERRORS:-no error message}\`" \
              "" \
              "Run log: $RUN_URL"
            exit 1
          fi

          # Take whichever content root the query returned, then keep only the
          # items that belong to OUR project.
          NODES=$(printf '%s' "$PROJ" | jq -c --arg n "$PROJECT_NUMBER" '
            [ ((.data.repository // {}) | (.issue // .pullRequest // {}) | .projectItems.nodes // [])[]
              | select(.project.number == ($n | tonumber)) ]')
          TOTAL_ITEMS=$(printf '%s' "$PROJ" | jq -r '
            ((.data.repository // {}) | (.issue // .pullRequest // {}) | .projectItems.totalCount) // 0')
          ITEM_COUNT=$(printf '%s' "$NODES" | jq -r 'length')

          if [ "$ITEM_COUNT" = "0" ]; then
            # A truncated page is not proof of absence: say which case this is.
            if [ "$TOTAL_ITEMS" -gt 20 ]; then
              decide api-error \
                "⚠️ \`/fr-pass\` could **not** be applied: this item is on $TOTAL_ITEMS projects and the handler reads only the first 20, so project #$PROJECT_NUMBER may have been cut off." \
                "" \
                "Raise the \`projectItems(first: 20)\` page size in \`fr-pass-comment.yml\`. Run log: $RUN_URL"
              exit 1
            fi
            decide not-on-project \
              "🔍 \`/fr-pass\` did nothing: this item is not on the [engineering kanban]($BOARD_URL) (project #$PROJECT_NUMBER), so there is no card to advance." \
              "" \
              "\`add-to-kanban.yml\` normally adds every new issue and PR. If it was missed, add the card, set **FR on staging**, then comment \`/fr-pass\` again. If the tracked work lives on a linked issue rather than this PR, sign off there instead."
            exit 1
          fi

          if [ "$ITEM_COUNT" != "1" ]; then
            # A single piece of content can only sit on a project once, so this
            # means the board data is odd. Do not guess which card was meant.
            decide ambiguous-item \
              "⚠️ \`/fr-pass\` did nothing: this item resolves to $ITEM_COUNT separate cards on project #$PROJECT_NUMBER, so the handler will not guess which one to advance." \
              "" \
              "Clean up the duplicate on the [engineering kanban]($BOARD_URL) and comment \`/fr-pass\` again."
            exit 1
          fi

          ITEM_ID=$(printf '%s' "$NODES" | jq -r '.[0].id')
          CURRENT=$(printf '%s' "$NODES" | jq -r '.[0].fieldValueByName.name // ""')

          # The two column names below are hard-coded and this board has been
          # renamed before, so check they exist and fail loudly on the next rename.
          # (internal ref) rename shim, inert today: STAGING_REVIEW resolves to "FR on
          # staging" unless the board has "Staging (human review)"; NEITHER still fails.
          if printf '%s' "$PROJ" | jq -e '.data.organization.projectV2.field.options[]
                | select(.name == "Staging (human review)")' > /dev/null; then
            STAGING_REVIEW="Staging (human review)"
          else
            STAGING_REVIEW="FR on staging"
          fi
          for WANT in "$STAGING_REVIEW" "Ready for prod"; do
            if ! printf '%s' "$PROJ" \
              | jq -e --arg s "$WANT" '.data.organization.projectV2.field.options[] | select(.name == $s)' > /dev/null; then
              decide missing-option \
                "⚠️ \`/fr-pass\` could **not** be applied: project #$PROJECT_NUMBER has no \`Status\` option named **$WANT**, so the card was left alone." \
                "" \
                "The board's columns were probably renamed. Update the column names in \`.github/.github/workflows/fr-pass-comment.yml\`. Run log: $RUN_URL"
              exit 1
            fi
          done

          # ------------------------------------------------------ 5. the column
          case "$CURRENT" in
            "Staging (human review)"|"FR on staging")
              NEXT="Ready for prod"
              ;;
            "Ready for prod" | "Prod")
              decide already-advanced \
                "✅ Nothing to do: this card is already in **$CURRENT**, past the staging functional review." \
                "" \
                "No change made — you can ignore this."
              # Stays 0: the gate is already satisfied, so the caller got the
              # state they asked for. Nothing is left for a human to do, which is
              # the only thing a red run is here to say.
              exit 0
              ;;
            "")
              decide no-status \
                "🔍 \`/fr-pass\` did nothing: this card is on the board but its \`Status\` is empty, so there is no column to advance from." \
                "" \
                "Set it to **FR on staging** on the [engineering kanban]($BOARD_URL) and comment \`/fr-pass\` again."
              exit 1
              ;;
            *)
              decide wrong-column \
                "🔍 \`/fr-pass\` did nothing: this card is in **$CURRENT**, and \`/fr-pass\` only advances **FR on staging → Ready for prod** (the one functional-review gate)." \
                "" \
                "Promote it to **FR on staging** first — that happens automatically when the release train pushes to \`staging\`."
              exit 1
              ;;
          esac

          NEXT_OPT=$(printf '%s' "$PROJ" | jq -r --arg s "$NEXT" \
            '.data.organization.projectV2.field.options[] | select(.name == $s) | .id')

          # Pass the option ID with -f (raw string), NOT -F: ProjectV2 option IDs can
          # be all-numeric, and -F coerces all-digit values to an integer, which the
          # $o: String! variable rejects. -f forces a string. (Some option IDs contain
          # letters today, but don't rely on that — IDs regenerate if recreated.)
          MUT_ERR="$RUNNER_TEMP/fr-pass.mutate.err"
          # THE WRITE'S BODY IS READ TOO ((internal ref)): an exit-0 errors[] response
          # must not post "advanced" on a card that did not move, and this event
          # fires once. The refusal's text joins gh's stderr in MUT_ERR for the note.
          # shellcheck disable=SC2016  # the $names here are GraphQL variables, not shell - keep literal
          if ! WRESP=$(gh api graphql -f query='
            mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $p, itemId: $i, fieldId: $f,
                value: {singleSelectOptionId: $o}
              }) { projectV2Item { id } }
            }' -F p="$PROJECT_ID" -F i="$ITEM_ID" -F f="$STATUS_FIELD" -f o="$NEXT_OPT" 2> "$MUT_ERR") \
             || ! reject_graphql_errors "$WRESP" "the Status write" 2>> "$MUT_ERR"; then
            MUT_HEAD=$(sed -n '1,5p' "$MUT_ERR" | tr -d "$FENCE")
            decide mutation-failed \
              "⚠️ \`/fr-pass\` could **not** be applied: the card is still in **$CURRENT** — the write to project #$PROJECT_NUMBER failed." \
              "" \
              "$FENCE" \
              "$MUT_HEAD" \
              "$FENCE" \
              "" \
              "Re-comment \`/fr-pass\` to retry. Run log: $RUN_URL"
            exit 1
          fi

          echo "→ #$NUMBER: $CURRENT → $NEXT"
          decide advanced
          {
            echo "from=$CURRENT"
            echo "to=$NEXT"
          } >> "$GITHUB_OUTPUT"

      - name: Report the outcome (👍 / 👎 + why)
        # always(), with no `steps.*` condition: if the step above died before it
        # could publish anything, THAT is the case most in need of reporting.
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_FULL: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RESULT: ${{ steps.assess.outputs.result }}
          FROM: ${{ steps.assess.outputs.from }}
          TO: ${{ steps.assess.outputs.to }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          NOTE_FILE="$RUNNER_TEMP/fr-pass.note.md"
          OUTCOME="${RESULT:-}"
          if [ -z "$OUTCOME" ]; then
            # The step above produced no output at all — it was cancelled, or it
            # died before its EXIT trap could run. Still report something.
            OUTCOME="internal-error"
            if [ ! -s "$NOTE_FILE" ]; then
              printf '%s\n' \
                "⚠️ The \`/fr-pass\` handler stopped before deciding anything, so the card was **not** moved." \
                "" \
                "Run log: $RUN_URL" > "$NOTE_FILE"
            fi
          fi

          # The one intentionally silent outcome: the comment mentioned /fr-pass
          # but never issued it. Reacting to prose would make the bot noise.
          if [ "$OUTCOME" = "not-a-command" ]; then
            echo "Not a /fr-pass command — no reaction, by design."
            echo "### /fr-pass: not a command (no action taken)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$OUTCOME" = "advanced" ]; then
            REACTION="+1"
            SUMMARY="advanced #$NUMBER: $FROM → $TO"
          else
            REACTION="-1"
            SUMMARY="no-op on #$NUMBER ($OUTCOME)"
          fi

          FAILED=""

          # Reaction. THE REACTION IS NO LONGER ALLOWED TO FAIL THE RUN ON ITS OWN
          # ((internal ref)): it 403'd on every real invocation through three
          # diagnoses written into this file as settled, and what is not in doubt
          # is that on those runs the card advanced and a SUCCESSFUL advance
          # reported red -- at the single human gate in the pipeline
          # ((internal ref) D6), which teaches the operator to distrust it. So
          # the verdict follows the OUTCOME, the reaction degrades to a warning
          # WITH A FALLBACK (the outcome said in words, below), and the run fails
          # only when NEITHER reached the thread. fr-pass-report-selftest.py pins it.
          REACT_ERR="$RUNNER_TEMP/fr-pass.react.err"
          REACTED=1
          if ! gh api -X POST "/repos/$REPO_FULL/issues/comments/$COMMENT_ID/reactions" \
            -f content="$REACTION" > /dev/null 2> "$REACT_ERR"; then
            echo "::warning::Could not react on comment $COMMENT_ID — saying the outcome in words instead."
            sed -n '1,6p' "$REACT_ERR"
            REACTED=0
          fi

          # THE FALLBACK: a clean advance carries no note, so when the thumb was the
          # only feedback and did not land, synthesise one; an existing note already
          # says more than this would, so leave it alone.
          if [ "$REACTED" -eq 0 ] && [ ! -s "$NOTE_FILE" ]; then
            if [ "$OUTCOME" = "advanced" ]; then
              # shellcheck disable=SC2016  # the backticks below are markdown code spans
              printf '`/fr-pass` — **advanced #%s: %s → %s**.\n\n(The 👍 could not be posted: `%s`. The card moved; this comment is the receipt.)\n' \
                "$NUMBER" "$FROM" "$TO" "$(sed -n '1p' "$REACT_ERR" | tr -d '\r')" > "$NOTE_FILE"
            else
              # shellcheck disable=SC2016  # the backticks below are markdown code spans
              printf '`/fr-pass` — **no-op on #%s** (`%s`).\n\n(The 👎 could not be posted: `%s`.)\n' \
                "$NUMBER" "$OUTCOME" "$(sed -n '1p' "$REACT_ERR" | tr -d '\r')" > "$NOTE_FILE"
            fi
          fi

          # Explanation. Only outcomes that are a real problem carry a note; a
          # clean advance stays a bare 👍 so the happy path keeps the thread quiet.
          if [ -s "$NOTE_FILE" ]; then
            # Prepend the marker the job `if` tests for, so this handler never
            # answers its own notes ((internal ref)) -- at the single place a note is
            # posted, first line because the `if` uses startsWith; GitHub hides an
            # HTML comment when rendering but keeps it in the event's body.
            BODY=$(printf '%s\n\n%s\n' '<!-- fr-pass-handler -->' "$(cat "$NOTE_FILE")")
            COMMENT_ERR="$RUNNER_TEMP/fr-pass.comment.err"
            # REST, not `gh pr/issue comment`: a PR's conversation IS an issue, so
            # this one endpoint covers both without branching on the item type.
            if ! gh api -X POST "/repos/$REPO_FULL/issues/$NUMBER/comments" \
              -f body="$BODY" > /dev/null 2> "$COMMENT_ERR"; then
              echo "::error::Could not post the explanation on #$NUMBER."
              sed -n '1,6p' "$COMMENT_ERR"
              FAILED="$FAILED comment"
            fi
          fi

          {
            echo "### /fr-pass: $SUMMARY"
            echo ""
            echo "- outcome: \`$OUTCOME\`"
            if [ "$REACTED" -eq 1 ]; then
              echo "- reaction: $REACTION on comment $COMMENT_ID"
            else
              echo "- reaction: REFUSED on comment $COMMENT_ID — outcome reported by comment"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # A write that failed must not leave a green run: `FAILED` means the
          # COMMENT could not be posted -- a failed reaction alone became a comment
          # above, and this check covers that comment.
          if [ -n "$FAILED" ]; then
            echo "::error::/fr-pass could not report its outcome ($FAILED). Outcome was: $OUTCOME"
            exit 1
          fi

          if [ "$REACTED" -eq 0 ]; then
            echo "/fr-pass → $OUTCOME (reaction refused; reported by comment instead)"
            exit 0
          fi

          echo "/fr-pass → $OUTCOME (reacted $REACTION)"
