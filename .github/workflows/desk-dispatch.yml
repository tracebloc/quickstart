name: Desk dispatch

on:
  pull_request:
    types: [opened, ready_for_review, review_requested, synchronize, unlabeled]
  # THE GREEN GATE (Lukas, 2026-09-14): a review fires only once the head is green,
  # and a CI workflow completing is the event that carries that. The list names
  # EVERY workflow of THIS repo that runs on a pull-request event (a `workflow_run`
  # trigger can name only sibling workflows, never a pattern). Every one: the
  # dispatcher acts only when every run on the head is terminal, so a listed
  # completion has to be the LAST one, and a pull-request workflow left off the
  # list that finishes last leaves the review UNFIRED -- nothing re-fires
  # ((internal ref), (internal ref)). The set is DERIVED, not kept by
  # hand: `test_the_canonical_caller_is_gated_and_subscribes_to_no_check_suite`
  # reads this repo's workflow files and reddens on a missing or an extra name.
  # NEVER `check_suite` for the Actions app here: the caller's own run is such a
  # suite and would re-trigger this workflow forever.
  workflow_run:
    # A `workflow_run`'s `branches` filter is on the TRIGGERING run's head branch,
    # which for a PR run is the PR's feature branch -- so an allow-list of
    # `develop` would exclude every PR. Ignoring the integration branches instead
    # drops the `push` and cron completions (Caller inventory drift and
    # Org-standards sync run on Mondays on `develop`), each of which would start
    # a dispatch that finds no PR and skips (the review account, (internal ref)).
    branches-ignore: [develop, staging, main]
    workflows:
      - Add to engineer kanban
      - Bugbot review gate
      - Code quality
      - FR gate
      - Model-zoo paths
      - Route kanban Status on closure
      - Set PR card Status on project
      - Template rules
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read

# One group per PR for EVERY event kind: a workflow_run / check_suite event carries
# the PR under `<event>.pull_requests[0].number`. Keying them differently would let
# a request and a finishing run on one PR execute in parallel and both read the
# lock label as free (the defect ship-dispatch.yml had, (internal ref)).
concurrency:
  group: desk-dispatch-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_suite.pull_requests[0].number || github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
  cancel-in-progress: false

# NO `permissions:` BLOCK IN THIS REUSABLE, DELIBERATELY -- see "THAT SENTENCE WAS
# FALSE" above. (A self-contained render of this file DOES carry one: there the
# caller and the callee are one file, so the block that lands is the caller's
# grant, which is the opposite case -- tracebloc/quickstart#16.)
# The token is the caller's; every caller declares its grants explicitly.

jobs:
  dispatch:
    name: desk / dispatch
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      # WHEN THIS JOB STARTED, for the hold the dispatcher takes on a no-op
      # ((internal ref) D6 lever 1). A job bills a rounded-up minute, and a dispatch
      # whose verdict is "still in progress" exits at ~20 s while every sibling
      # completion on the head starts another run; the concurrency group above
      # keeps one pending and cancels the rest unstarted. The script therefore
      # holds its slot until ~45 s after this stamp (ABSORB_UNTIL_SECONDS in
      # scripts/desk-dispatch.py, DISPATCH_ABSORB_UNTIL to override), so a burst
      # of N completions costs two billed runs instead of about N/2 -- and drops
      # nothing: the one pending successor starts after the hold and reads the
      # head as it then is. That holds while every run a caller can queue
      # re-reads the head; a caller subscribing to `unlabeled` also queues runs
      # that skip on the label name before any read, and GitHub cancels a PENDING
      # run whenever a new one queues -- so such a run CAN supersede a pending
      # meaningful one ((internal ref); the concurrency paragraph in
      # desk-dispatch-caller.yml's header has the sequence and the price of
      # closing it). First, before the mints, so the hold measures from
      # as near the job's start as a step can see; a caller without this step
      # gets no hold and behaves exactly as before.
      - name: Note when this job started
        id: started
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Mint a read-only token for org-config (private; the caller's own token cannot read it)
        id: org-config-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-config
          permission-contents: read
      # SCOPED to the caller repo and to pull-requests: write. Used for exactly one
      # call, the reviewer request on a staff decision (see the header): an event
      # raised by this token starts the caller's `review_requested` run, which an
      # event raised by `github.token` never would.
      # Only the two event shapes that can produce a `staff` decision mint it: every
      # other dispatch (review_requested, synchronize, workflow_run) never uses this
      # token and must not depend on the App holding pull-requests: write for it.
      - name: Mint a pull-requests token for the reviewer request (an App event fires a run; github.token's does not)
        id: request-token
        if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'ready_for_review')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      # SCOPED to the caller repo and to actions: write, for exactly one call: the
      # in-place re-run of a STALE `bugbot / review` run ((internal ref); the decision
      # is `heal_stale_gate` in scripts/desk-dispatch.py -- the gate would pass if
      # evaluated now, so its recorded red is stale). As the App, for the reason the
      # request token above exists: the re-run's completion must be a `workflow_run`
      # the caller sees, and an event raised by `github.token` starts no run.
      # `continue-on-error`, DELIBERATELY: the App holds `actions: read` until its
      # installation is bumped to write, and a refused mint must not redden every
      # dispatch in the fleet. The token is then empty, and the script refuses ONLY
      # when it finds a stale red it could have healed, naming the missing grant.
      # Minted on EVERY event this dispatcher acts on, and the condition names no
      # action on purpose. It used to name three (`workflow_run`, `review_requested`,
      # `synchronize`) on the premise that a staffing event never meets a recorded
      # verdict; that premise is false. `opened` / `ready_for_review` with `reviewer`
      # ALREADY requested is a `review` decision in `decide_ungated` -- no
      # `review_requested` is ever raised for a no-op request -- so it runs the same
      # green gate and reaches the same `heal_or_skip`, where an empty token makes the
      # script refuse and name a grant the App may already hold. An action list here
      # is a second copy of the script's arms with nothing to hold the two together;
      # the event name is not, so `on.pull_request.types` can grow without this
      # drifting. A mint on an event that turns out to need no heal costs one scoped,
      # unused installation token.
      - name: Mint an actions token for re-running a stale Bugbot gate in place (tolerates a refused mint)
        id: rerun-token
        if: github.event_name == 'workflow_run' || github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
      # A FOURTH scoped mint, for exactly ONE read: the base branch's
      # required-status-context list, so a red check that is NOT required stops
      # holding the head while a red required one still does ((internal ref); the
      # callee is `gate_required` / `required_contexts` in scripts/desk-dispatch.py).
      # `the private source repo`'s own fleet audits run on a
      # `pull_request` and report on the LIVE state of every OTHER repo in the org,
      # so one repo drifting anywhere turned an inventory PR here red and the desk
      # stopped reviewing the very PR that fixes the drift -- circular.
      #
      # SCOPED TO THE CALLER'S OWN REPO, AND READ-ONLY, and that narrowness is the
      # whole justification rather than a detail of it. An ORG-WIDE `actions: write`
      # mint on the 20-minutely sweep was proposed this wave and its PR closed
      # unmerged, deliberately. This is narrower on BOTH axes -- one repo, not
      # `owner`; read, not write -- so it is not that decision again. Do not widen
      # either axis without the measurement that justifies it: `administration:
      # read` cannot change protection, `administration: write` is the grant that
      # could, and onboard-repo.yml records that this App deliberately holds only
      # read (measured 2026-09-10).
      #
      # NO NEW ORG GRANT IS NEEDED, and it is measured rather than assumed, twice.
      # `bricked-prs.yml` mints `permission-administration: read` from the SAME App
      # this reusable mints from (its `dispatcher-app-id` is `RELEASE_TRAIN_APP_ID`,
      # which is the app-id bricked-prs.yml names directly), and
      # `create-github-app-token` cannot mint a permission the installation lacks.
      # Measured on that workflow's 2026-09-18 run: its "Mint an installation
      # token" step succeeded. Stronger than the mint, the same run's audit then
      # printed one train branch's required-context list, byte-identical to an
      # independent admin read of that branch's protection -- so the token does not
      # merely mint, it reads, correctly, in production, the exact list this
      # consumes. (The run id and the branch are named on the PR that wired this,
