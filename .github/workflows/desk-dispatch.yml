# THE SHIP LOCK IS GONE ((internal ref)). `claude-ship:driving` was the
# author's session lock, and the dispatcher deferred on it and re-entered on the
# caller's `unlabeled` type ((internal ref), (internal ref)). The ship dispatcher
# retired, FIX MODE fires the reviewer to fix instead, and the deferral, the
# `unlabeled` arm and the `ship-stale-minutes` input went with it.
