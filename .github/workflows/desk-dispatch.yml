      # A SEPARATE MINT, not another permission folded onto one of the three above:
      # a permission the installation ever stops holding would take the WHOLE
      # dispatcher down instead of degrading this one feature.
      #
      # `continue-on-error`, DELIBERATELY -- and NOT in the snippet (internal ref)
      # wrote out. Without it a refused mint fails the job, which is precisely the
      # outcome the separate-mint rule above exists to prevent; the separation only
