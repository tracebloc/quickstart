# NO `paths:` FILTER may ever be added by a caller; NO `cancel-in-progress` here
# (reusable-no-cancel: a cancelled corpse on an unchanged sha reddens the rollup).
name: Desk dispatch

on:
  pull_request:
    types: [opened, ready_for_review, review_requested, synchronize, unlabeled]
  # NO BASE FILTER HERE ((internal ref), (internal ref)): `on:` filters a BASE ref
  # only and a base-ref filter would also drop an emergency hotfix into `main`,
  # so the promotion predicate can only live in the callee's `if:`.
  # THE GREEN GATE (Lukas, 2026-09-14): a review fires only once the head is green,
  # and a CI workflow completing is the event that carries that. The list names
  # EVERY workflow of THIS repo that runs on a pull-request event -- a completion
  # left off the list that finishes last leaves the review UNFIRED, nothing
  # re-fires ((internal ref), (internal ref)). The set is DERIVED:
  # `test_the_canonical_caller_is_gated_and_hears_bugbots_check_suite` reads
  # this repo's workflow files and reddens on a missing or an extra name.
  workflow_run:
    # A `workflow_run`'s `branches` filter is on the TRIGGERING run's head branch
    # -- a PR run's feature branch -- so integration branches are IGNORED rather
    # than `develop` allowed: that drops the `push` and cron completions ((internal ref)).
    branches-ignore: [develop, staging, main]
    workflows:
      - Add to engineer kanban
      - Code quality
      - Commit hygiene
      - FR gate
      - Model-zoo paths
      - Mutation coverage
      - Route kanban Status on closure
      - Set PR card Status on project
      - Template rules
    types: [completed]
  # `check_suite: completed` IS subscribed, for Cursor Bugbot: the `Bugbot gate`
  # workflow that turned Bugbot's verdict into a completion here is retired
  # ((internal ref)), and Bugbot finishes after the required checks on
  # about half of all pushes, so its own check suite completing is then the event
  # that carries the green. It cannot loop: GitHub starts no workflow for a check
  # suite that GitHub Actions created, so this workflow never hears its own run
  # (the loop (internal ref) feared).
  check_suite:
    types: [completed]
  # `issue_comment: created` IS subscribed, for the desk's STAND-DOWN
  # ((internal ref) item 3): a desk that stands down on a red it judges a
  # flake asks, in its comment, for that job to be re-run, and the comment's own
  # creation is the only event that carries the ask -- without this trigger the
  # callee's re-run arm never runs ((internal ref) waited about seven hours for
  # a re-run by hand). The callee's JOB `if:` passes only a created comment on a
  # pull request, by the review account, starting `STAND-DOWN `; every other
  # comment is a SKIPPED job, which starts no runner. `created` alone: an edit asks
  # for nothing, so a wider list would be a run per edit for nothing, and
  # desk-dispatch-selftest drives every listed type through that filter.
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read

# One group per PR for EVERY event kind: a workflow_run / check_suite event carries
# the PR under `<event>.pull_requests[0].number`. Keying them differently would let
# a request and a finishing run on one PR execute in parallel and both read the
# lock label as free (the defect the retired ship-dispatch.yml had, (internal ref)).
#
# AN `unlabeled` NEVER SHARES THE REVIEW GROUP ((internal ref)): GitHub cancels
# the PENDING run of a group whenever a new one queues ((internal ref)), so a label
# coming off would supersede a pending review. A `claude-` label coming off queues in
# `release-<pr>`, where the newest pending run reads the newest labels; every other
# `unlabeled` gets a group of its own run and supersedes nothing. The key does not ask
# the SENDER -- the self-contained render proves its top-level `concurrency:` equal to
# this text, before any `inputs.*` is resolved -- so someone else's `claude-` removal
# shares the group and is skipped by the job's `if:`; it can supersede a PENDING
# release only inside the ~minute that release waits, and the sweep's pass is still the
# backstop there. The selftest evaluates this key against the job's `if:`.
#
# A STAND-DOWN COMMENT GETS A GROUP OF ITS OWN ((internal ref) item 3):
# `comment-<id>`, never a PR number or a sha. An `issue_comment` payload carries
# none of the keys above, so without its own arm every comment in the repo would
# share one group `desk-dispatch-<workflow>-` -- and a group is applied BEFORE the
# job's `if:`, keeping ONE pending run per group, so an unrelated comment could
# replace a pending desk run and a review would never fire. The arm sits after
# `pull_request.number`, which a comment's payload never carries (it has `issue`),
# so every PR event keeps its number. desk-dispatch-selftest derives the group for
# every subscribed event and holds the two apart.
concurrency:
  group: desk-dispatch-${{ github.workflow }}-${{ github.event.action == 'unlabeled' && (startsWith(github.event.label.name, 'claude-') && format('release-{0}', github.event.pull_request.number) || format('noop-{0}', github.run_id)) || github.event.pull_request.number || github.event_name == 'issue_comment' && format('comment-{0}', github.event.comment.id) || github.event.workflow_run.pull_requests[0].number || github.event.check_suite.pull_requests[0].number || github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
  cancel-in-progress: false

# NO `permissions:` BLOCK IN THIS REUSABLE, DELIBERATELY -- see the header. (A
# self-contained render DOES carry one: there caller and callee are one file, so
# the block that lands is the caller's grant -- tracebloc/quickstart#16.)

jobs:
  dispatch:
    name: desk / dispatch
    runs-on: ubuntu-slim
    timeout-minutes: 10
    # NOT ON A PROMOTION PR ((internal ref)): a promotion PR's head sha IS a
    # branch tip, and the runs every promotion queued here left `cancelled`
    # check-runs on it that hop-verify.sh reads as a VOID outranking every green
    # verdict -- the staging hop went from 16 repos verified to 0 of 18. Skipping
    # is the whole fix: the desk strips reviewers off promotions, and a job
    # skipped by `if:` concludes `skipped`, which hop-verify.sh allowlists.
    #
    # BOTH HALVES ARE REQUIRED, AND THE BASE REF ALONE IS NOT THE RULE
    # ((internal ref)): (internal ref)'s `scripts/hotfix-repo.sh` opens a PR into
    # `main` for an emergency fix, so dropping on a base-ref match alone drops a
    # hotfix with no reviewer staffed. The predicate is a TRAIN BRANCH going INTO
    # a promotion branch; `release-train/` rather than `release-train/to-` because
    # the train owns that namespace. BOTH HALVES SPELL `is_promo` EXACTLY --
    # `(release-train/* OR hotfix-backmerge/*) AND base in (staging, main, master)`
    # in scripts/desk-dispatch.py -- and scripts/tests/callershape.py
    # `assert_promotion_guard` evaluates THIS expression over every (head, base)
    # of its matrix against the real `is_promo`. An event shape carrying neither
    # ref yields nulls and the job RUNS: a wasted minute beats an unreviewed PR.
    #
    # A COMMENT RUNS ONLY AS THE DESK'S STAND-DOWN ((internal ref) item 3):
    # created (an edit could rewrite the line), on a PR, by the reviewer, starting
    # `STAND-DOWN `. Every other comment is a SKIPPED job, which costs no runner;
    # the script checks each of the four again (`stand_down_rerun_ask`). A skipped
    # comment run attaches to the default branch's commit, not a PR's head, so it
    # stays out of every PR's check rollup (measured on the PR that wired this).
    # callershape `assert_promotion_guard` evaluates this half as well.
    #
    # THE SECOND CLAUSE ((internal ref)): an `unlabeled` runs the job only as
    # the reviewer's release of a `claude-` label; any other label coming off, or any
    # other sender, skips it before a runner starts. The concurrency key above asks the
    # label only, and the selftest holds every release this admits to its group.
    if: >-
      !((startsWith(github.event.pull_request.head.ref
      || github.event.workflow_run.head_branch
      || github.event.check_suite.head_branch, 'release-train/')
      || startsWith(github.event.pull_request.head.ref
      || github.event.workflow_run.head_branch
      || github.event.check_suite.head_branch, 'hotfix-backmerge/'))
      && contains(fromJSON('["staging", "main", "master"]'),
      github.event.pull_request.base.ref
      || github.event.workflow_run.pull_requests[0].base.ref
      || github.event.check_suite.pull_requests[0].base.ref))
      && (github.event.action != 'unlabeled'
      || (github.event.sender.login == 'tracebloc-review'
      && startsWith(github.event.label.name, 'claude-')))
      && (github.event_name != 'issue_comment'
      || (github.event.action == 'created'
      && github.event.issue.pull_request
      && github.event.comment.user.login == 'tracebloc-review'
      && startsWith(github.event.comment.body, 'STAND-DOWN ')))
    steps:
      # WHEN THIS JOB STARTED, for the hold the dispatcher takes on a no-op
      # ((internal ref) D6 lever 1): a job bills a rounded-up minute, and a "still in
      # progress" verdict exits at ~20 s while every sibling completion starts
      # another run, so the script holds its slot until ~45 s after this stamp
      # (ABSORB_UNTIL_SECONDS in scripts/desk-dispatch.py) and a burst of N
      # completions costs two billed runs instead of about N/2, dropping nothing
      # (the caveat for runs that read nothing is in desk-dispatch-caller.yml's
      # header, (internal ref)). First, before the mints; a caller without this step gets no hold.
      - name: Note when this job started
        id: started
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Mint a read-only token for org-config (private; the caller's own token cannot read it)
        id: org-config-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-config
          permission-contents: read
      # THE TOOLS REF ((internal ref) D4, (internal ref)): `job.workflow_sha` is the commit
      # of THIS reusable file, so the scripts below are the ones it was reviewed
      # with; `tools-ref` overrides it for a test. An EMPTY ref would check out the
      # tools repo's DEFAULT branch fleet-wide, so it is refused. `toJSON(job)` because
      # actionlint's `job` schema (1.7.12) does not know `workflow_sha`.
      - name: Resolve the tools ref, refusing an empty one
        id: tools-ref
        env:
          TOOLS_REF: ${{ 'main' }}
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          if [ -z "$TOOLS_REF" ]; then
            case "$JOB_CONTEXT" in
              *'"workflow_sha"'*) TOOLS_REF="${JOB_CONTEXT#*\"workflow_sha\": \"}"; TOOLS_REF="${TOOLS_REF%%\"*}" ;;
            esac
          fi
          if ! [[ "$TOOLS_REF" =~ ^[0-9a-f]{40}$ || ( -n "$TOOLS_REF" && "$TOOLS_REF" != *[![:alnum:]._/-]* ) ]]; then
            echo "::error::the tools ref is empty or not a ref (${TOOLS_REF:-<empty>}); an empty ref would check out the tools repo's default branch instead of the commit this workflow was pinned at. Refusing."
            exit 1
          fi
          echo "ref=$TOOLS_REF" >> "$GITHUB_OUTPUT"
          echo "tools ref: $TOOLS_REF"
      - name: Check out the dispatcher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/org-config
          token: ${{ steps.org-config-token.outputs.token }}
          ref: ${{ 'main' }}
          path: .org-config-tools
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # THE PRE-CHECK ((internal ref)): the SAME script, on the job's own
      # token only, before the two App mints below. It stops the run -- `go=false`,
      # after the same concurrency hold `main` takes -- only on a verdict the
      # protection read cannot change: an event that acts on nothing (not a
      # completion, no open PR, a draft / bot / promotion PR, an older push, an event
      # no reviewer arm owns), or a head still running a check that holds it however
      # the base is protected. Anything else, and anything it cannot tell, is `go`.
      # Each mint's revoke and each protection read is a call on the App
      # installation's bucket, which the fleet drained on 2026-09-29; a run the
      # pre-check stops spends one (the the private source repo mint's revoke above, which the
      # checkout needs) instead of about five. `continue-on-error` and the `!=
      # 'false'` below make a crashed or silent pre-check `go`: this step can save a
      # run, never lose one. The decision is `precheck` in scripts/desk-dispatch.py,
      # which calls `main`'s own functions -- none of it lives in this file.
      - name: Pre-check on the job's own token whether this run can fire at all
        id: precheck
        if: github.event.action != 'unlabeled'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_T0: ${{ steps.started.outputs.at }}
          DESK_REVIEWER: ${{ 'tracebloc-review' }}
        run: python3 .org-config-tools/scripts/desk-dispatch.py --precheck
      # SCOPED to the caller repo and to actions: write, for exactly one call: an
      # in-place re-run, as the App so the re-run's completion is a `workflow_run` the
      # caller sees, of a run behind a CANCELLED required context on the live head,
      # once per run ((internal ref) item 1, (internal ref); `heal_cancelled`
      # in scripts/desk-dispatch.py) -- no session can re-run one, and no other token
      # here may. The same token, for the same one call, re-runs the failed jobs of
      # the run a desk stand-down names (`rerun_after_stand_down`, (internal ref)):
      # no new grant. (The stale-`bugbot / review` re-run it was first minted for retired
      # with the Bugbot gate, (internal ref).) `continue-on-error`,
      # DELIBERATELY: a refused mint must not redden every dispatch, and the
      # script refuses ONLY when it finds a cancelled red it could have healed. Minted
      # on EVERY event this dispatcher acts on, the condition naming no action:
      # an action list here would be a second copy of the script's arms (an
      # `opened` event can meet a recorded verdict too, via `decide_ungated`).
      - name: Mint an actions token for re-running a cancelled required run in place (tolerates a refused mint)
        id: rerun-token
        if: github.event.action != 'unlabeled' && steps.precheck.outputs.go != 'false' && (github.event_name == 'workflow_run' || github.event_name == 'check_suite' || github.event_name == 'pull_request' || github.event_name == 'issue_comment')
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
      # A THIRD scoped mint, for exactly ONE read: the base branch's
      # required-status-context list, so a red check that is NOT required stops
      # holding the head while a red required one still does ((internal ref);
      # `gate_required` / `required_contexts` in scripts/desk-dispatch.py) --
      # this repo's own fleet audits report on OTHER repos' live state, so one
      # repo drifting anywhere turned an inventory PR here red and the desk
      # stopped reviewing the PR that fixes the drift.
      #
      # SCOPED TO THE CALLER'S OWN REPO, AND READ-ONLY, and that narrowness is
      # the whole justification: an org-wide `actions: write` mint on the sweep
      # was proposed and closed unmerged, and `administration: write` is the
      # grant that could change protection. NO NEW ORG GRANT IS NEEDED: another
      # workflow already mints `permission-administration: read` from the same
      # App and reads a protection list byte-identical to an admin read (its run
      # is named on the PR that wired this, not here -- this file is delivered to
      # PUBLIC repos). A SEPARATE MINT, so a permission the installation stops
      # holding degrades this one feature instead of taking the dispatcher down;
      # `continue-on-error`, DELIBERATELY, for the same reason: a refused mint
      # leaves the token EMPTY and `gate_required` returns None without calling,
      # so every red holds the head -- the fail-CLOSED direction (rule 3). Its ONE
      # `if:` is the pre-check's: every caller trigger that gets past it reaches a
      # `gate_required` call.
      # THE RELEASE'S PRE-CHECK ((internal ref)): `merge_one` on the job's own
      # token, before the two mints below. It says `go` only when every merge condition
      # but the base's required contexts holds, so a release after a change request, a
      # stand-down or a fix mints nothing; like the review pre-check it never refuses,
      # and a crashed or silent one is `go` (`!= 'false'`).
      - name: Pre-check on the job's own token whether the released PR can merge
        id: merge-precheck
        if: github.event.action == 'unlabeled'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DESK_REVIEWER: ${{ 'tracebloc-review' }}
          SWEEP_MERGE_EXCLUDE: ${{ vars.SWEEP_MERGE_EXCLUDE }}
        run: python3 .org-config-tools/scripts/desk-dispatch.py --merge-precheck
      - name: Mint a protection-read token for the base branch's required contexts (tolerates a refused mint)
        id: protection-token
        if: steps.precheck.outputs.go != 'false' && steps.merge-precheck.outputs.go != 'false'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
      # THE RELEASE'S MERGE MINT: `contents: write` -- the one grant GitHub serves
      # `PUT pulls/{n}/merge` on -- scoped to the caller repo, and only while the switch
      # is the word `merge_backstop_on` merges on, read in the CALLER's variables. Off,
      # this step is skipped and no token in this job can merge. A merge made as the
      # App starts the base's push workflows (a `GITHUB_TOKEN` merge would not). No
      # `workflows: write`: a PR that changes .github/workflows/ stays NOT MERGED.
      - name: Mint the merge backstop's contents-write token (a release, while the switch is on)
        id: merge-token
        if: github.event.action == 'unlabeled' && vars.SWEEP_MERGE_BACKSTOP == 'on' && steps.merge-precheck.outputs.go != 'false'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      # NO FIRE URL AND NO ROUTINE TOKEN reach this step: it merges or it does not.
      - name: Merge the released PR if the backstop would
        if: github.event.action == 'unlabeled' && steps.merge-precheck.outputs.go != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          DESK_REVIEWER: ${{ 'tracebloc-review' }}
          DESK_PROTECTION_TOKEN: ${{ steps.protection-token.outputs.token }}
          SWEEP_MERGE_BACKSTOP: ${{ vars.SWEEP_MERGE_BACKSTOP }}
          SWEEP_MERGE_TOKEN: ${{ steps.merge-token.outputs.token }}
          SWEEP_MERGE_EXCLUDE: ${{ vars.SWEEP_MERGE_EXCLUDE }}
        run: python3 .org-config-tools/scripts/desk-dispatch.py --merge-backstop
      - name: Decide, lock, fire
        if: github.event.action != 'unlabeled' && steps.precheck.outputs.go != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_T0: ${{ steps.started.outputs.at }}
          DESK_RERUN_TOKEN: ${{ steps.rerun-token.outputs.token }}
          DESK_PROTECTION_TOKEN: ${{ steps.protection-token.outputs.token }}
          # FIX MODE ((internal ref) item 1): the DISPATCHER's switch -- whether
          # the desk is fired on a red or conflicting head. The review SESSION reads its
          # own `CRD_FIX_MODE` from the review routine's own environment, which no
          # workflow sets: TWO switches, and turning fix mode on is setting both. Unset is off.
          CRD_FIX_MODE: ${{ vars.CRD_FIX_MODE }}
          DESK_REVIEWER: ${{ 'tracebloc-review' }}
          DESK_FIRE_URL: ${{ (vars.DESK_ROUTINE_FIRE_URL) }}
          DESK_ROUTINE_TOKEN: ${{ secrets.DESK_ROUTINE_TOKEN }}
          # THE OTHER DESK ROUTINE ((internal ref); `FIRE_ROUTINES` in
          # scripts/desk-dispatch.py): both lines, or neither, under ONE condition, so a
          # URL never meets the other routine's token. A caller that passes neither
          # fires one routine, as before. desk-dispatch-selftest holds the shape.
          DESK_FIRE_URL_FAILOVER: ${{ ((vars.DESK_ROUTINE_FIRE_URL_2) != '' && secrets.DESK_ROUTINE_TOKEN_2 != '') && (vars.DESK_ROUTINE_FIRE_URL_2) || '' }}
          DESK_ROUTINE_TOKEN_FAILOVER: ${{ ((vars.DESK_ROUTINE_FIRE_URL_2) != '' && secrets.DESK_ROUTINE_TOKEN_2 != '') && secrets.DESK_ROUTINE_TOKEN_2 || '' }}
          DESK_STALE_MINUTES: ${{ 45 }}
        run: python3 .org-config-tools/scripts/desk-dispatch.py
