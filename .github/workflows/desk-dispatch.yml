# to the caller repo, and only while `vars.SWEEP_MERGE_BACKSTOP` is `on` IN THE CALLER
# REPO'S CONTEXT (a reusable reads the caller's variables); unset, the step writes a
# WOULD MERGE line and merges nothing. Any other `unlabeled` skips the job. A caller
# sends the type only once it lists it (the canonical caller first, then the fleet).
