# must be promoted before a caller relies on it ((internal ref)). The caller passes
# `with.fire-url: ${{ vars.DESK_ROUTINE_FIRE_URL }}`, `with.fire-url-failover:
# ${{ vars.DESK_ROUTINE_FIRE_URL_2 }}` and the four named secrets below, and nothing
