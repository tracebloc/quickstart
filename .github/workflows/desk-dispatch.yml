# desk-dispatch: fire ONE fresh code-review-desk session for ONE pull request, only
# when GitHub says a review is wanted ((internal ref) and (internal ref)).
#
# WHY. The desk used to be a five-minute cron inside a long-lived session that
# re-read ~500k tokens on every wake -- measured over 14 days, the single largest
# Claude Code cost on its machine. This reusable is the cheap shape: no model runs
# until an event arrives, then one session handles one PR. The workflow itself
# costs a few seconds of `ubuntu-slim`, billed as a whole minute -- which is why a
# no-op run holds its concurrency slot to the end of that minute while a check is
# still running ((internal ref) D6 lever 1; the stamp step below).
#
# WHO REVIEWS. `reviewer` is the identity whose review requests count and whose
# routine fires. It is a dedicated review account, not a person: the routine runs
# as that account (self-review mode in the skill, `CRC_SELF_REVIEW=1`), so every
# repo's CODEOWNERS requests it on every PR it may review and the review lands as
# that account. A person's login here would make their name stand in for a bot
# on every approval, and could never cover their own PRs.
#
# WHAT IT FIRES ON (the decision lives in scripts/desk-dispatch.py, tested offline):
#   review requested from `reviewer`                   -> a review session, IF the
#                                                          head is green
#   push to a PR `reviewer` has reviewed / is on       -> a re-review session, IF green
#   workflow_run completed (a CI workflow), or check_suite completed (Cursor
#     Bugbot's own suite): every CI run and commit status on the
#     head terminal and green, `reviewer` requested or already on the PR, head
#     not yet reviewed                                    -> a review session
#   a run or status still running / any red / mergeable_state dirty
#                                                       -> skip (the last one to
#                                                          finish fires; red waits
#                                                          for the author's fix)
#   PR opened or marked ready, non-draft, with
#     `reviewer` already requested (CODEOWNERS)       -> a review session, IF the head
#                                                          is green
#   ... `reviewer` not requested                       -> skip: nothing here staffs
#   a held red that is only CANCELLED runs on the live -> re-run each in place, as
#     head ((internal ref))                              the App, once per run; no
#                                                          session (`heal_cancelled`)
#   FIX MODE on (`vars.CRD_FIX_MODE`, the dispatcher's  -> a FIX session where a review
#     switch; (internal ref) item 1): a head      would be owed, once per head;
#     red on a held check, or dirty -- even before any    re-entered when the base moves
#     CI ran -- the reviewer requested or on the PR       (a red: once a red it met is
#                                                          green on the base tip)
#
# WHO STAFFS: CODEOWNERS ((internal ref)). Every repo with a desk caller carries
# `* @tracebloc-review` in its CODEOWNERS, so GitHub requests `reviewer` when a PR
# opens or leaves draft, and that request -- made as the PR's author, not as
# GITHUB_TOKEN -- raises the `review_requested` that fires the review. This job
# used to make the same request as the App and assign the author; CODEOWNERS made
# the first request on 1,214 of 1,230 PRs merged 17-24 Sep and this job on 13, so
# that arm and its App token went. The sweep never staffs either: CODEOWNERS is the
# ONE staffing path. Drafts, bots, promotion heads, team requests and the
# reviewer's own PRs are skipped with the reason in the job summary.
#
# THE GREEN GATE (Lukas, 2026-09-14). The review account is the most expensive
# check on a PR, so nothing fires until the head is green; Cursor Bugbot's own
# check is part of the rollup (its pending holds the head wherever it runs) and
# review latency becomes CI latency, by design. What "green" means is
# `head_state()` in scripts/desk-dispatch.py, shared with the sweep: every CI
# check run and commit status terminal and none red,
# the dispatchers' own `... / dispatch` runs excluded; `mergeable_state` is read
# for `dirty` only.
#
# WHY workflow_run, AND check_suite ONLY FOR BUGBOT. `workflow_run` names the CI
# workflows a caller follows, so its list is a contract caller-drift can check. A
# `check_suite` trigger cannot filter by app, and callers subscribe to it anyway since
# the Bugbot gate retired ((internal ref)): Cursor Bugbot finishes after the
# required checks on about half of all pushes, and its own suite completing is then
# the only event that carries the green. GitHub starts no workflow for a check suite
# GitHub Actions created, so the self-trigger loop (internal ref) feared cannot start
# (its script-side refusal was deleted as unreachable, (internal ref)). Callers MUST
# send `workflow_run: {workflows: [<every pull-request workflow of that repo>],
# types: [completed]}` and `check_suite: {types: [completed]}`, and grant
# `checks: read` + `statuses: read`. There is no ungated degrade any more: every
# desk caller grants both reads, and a 403 on the head read refuses like any failed
# read -- a red run, no review ((internal ref)). A pull-request workflow the caller
# does not list leaves the review unfired when it finishes last
# ((internal ref), (internal ref)).
