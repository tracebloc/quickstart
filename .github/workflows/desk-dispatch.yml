# `contents: read`) -- GRANTED BY THE CALLER, never declared here. The App token
# every run mints is ONLY to read this private repo's checker (`permission-contents:
# read` on the private source repo); the two others -- the heal's `actions: write`, the
# protection read's `administration: read` -- are minted only after the PRE-CHECK
