name: Bugbot review gate

# Reusable workflow. Makes Cursor Bugbot's review a GATE instead of advice
# ((internal ref)). `scripts/bugbot-gate.py` carries the measurements and
# the reasoning; this file is the wiring, and only says what the script cannot.
#
# WHY THIS IS NOT "ADD `Cursor Bugbot` TO THE REQUIRED CONTEXTS" ((internal ref)):
# Bugbot emits `success` when clean and `neutral` when it has findings, never
# `failure`, so requiring the context either gates nothing or permanently bricks
# every PR that ever received a finding (Bugbot re-runs only on a push or a
# `bugbot run`). So the verdict is REPORTED here and the decision is derived
# from the threads.
#
# ARMING THIS IS THREE STEPS, IN THIS ORDER: (1) this file reaches `main` --
# every caller pins this repo's reusables `@main`, so a caller added first dies
# with `startup_failure`; (2) callers are added and the gate is ADVICE, the whole
# of what (internal ref) asks for; (3) the `bugbot / review` context is added to
# branch protection once step 2 has been observed green on real PRs. Never the
# reverse ((internal ref); a required context no workflow reports leaves every PR
# waiting for ever, (internal ref)). The TEST tier is armed from the start:
# `bugbot-gate-selftest.py` and `-mutations.py` run inside `selftests`, already
# a required context.
#
# NO `paths:` FILTER, and the caller must not add one: a path-filtered required
# check never reports on a PR the filter skips, so the PR waits at "Expected --
# waiting for status" forever ((internal ref)).
#
# WHAT A CALLER MUST TRIGGER ON: `pull_request` with at least
# `[opened, reopened, synchronize, ready_for_review]`. `ready_for_review` is
# load-bearing: this gate deliberately PASSES a draft, so leaving that type out
# means the exemption is never lifted on a PR opened as a draft.
#
# THE TRIGGER THIS WANTS AND CANNOT HAVE YET: `pull_request_review_thread:
# [resolved]`. actionlint 1.7.12 -- a REQUIRED check in this repo, run with no
# config and no `-ignore` on purpose -- rejects the event name, so the failure
# message says: resolve the thread, then RE-RUN this check (a follow-up on (internal ref)).
#
# THIS JOB WAITS, on purpose: its claim is that Bugbot reviewed the CURRENT
# head, false for the first minutes after every push, so it polls, sized to the
# TAIL of Bugbot's measured verdict latency (the `wait-seconds` description
# holds the distribution; (internal ref) holds the measurement).
# WHAT A RED AT THE DEADLINE MEANS: a CLAIMED-but-unfinished head fails closed
# ("not yet", not "findings"); the remedy is **Re-run jobs** on THAT run, IN
# PLACE -- a second run on the same sha ADDS a run beside the red one, and
# `statusCheckRollup.state` is worst-of across every run on the commit
# (scripts/reusable-no-cancel.py). An unclaimed head exits 0 as UNREVIEWED
# ((internal ref) holds the open decision on whether it should block).
# THE EVENT-DRIVEN SHAPE THIS DOES NOT TAKE, and the measurements that decided
# it -- `pull_request_review` fires for 69 % of verdicts, `check_run` runs the
# default branch's file -- are on (internal ref); what is left is the
# runner, `ubuntu-slim`.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: bugbot-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The CALLER must grant at least these three, or the run fails at startup with
# no jobs -- a called workflow cannot hold more than its caller. `checks: read`
# and `pull-requests: read` are both load-bearing: the first reads the head's
# check runs, the second reads the review threads. `contents: read` is for the
# checkout of the checker.
permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  review:
    name: bugbot / review
    # `ubuntu-slim` ((internal ref)): this job is a REQUIRED context
    # nowhere (0 of 63 live branches, measured 2026-09-13), so a label that
    # failed to schedule could only delay an advisory check; since 2026-09-16
    # `scripts/runner-tier.py` expects every reusable on slim.
    runs-on: ubuntu-slim
    # Above the script's own 660 s budget on purpose -- the script, not the
    # runner, should report a timeout -- and below the 15-minute `ubuntu-slim`
    # cap, so the slack for mint + checkout + setup-python is 180 s. That is not
    # always enough (p99 setup on the slowest runs exceeds it and the platform
    # kills the job with no PENDING report); the trade against a shorter wait
    # budget is stated on `wait-seconds`, and bugbot-gate-selftest.py holds
    # default + 180 <= timeout < the cap.
    timeout-minutes: 14
    steps:
      # Same shape as code-quality.yml: the checker lives here, not in the
      # calling repo, and this repo is PRIVATE, so the checkout needs a read-only
      # App token minted from the two secrets the caller passes by name (Q5).
      - name: Mint a read-only token for org-config (private; the caller's own token cannot read it)
        id: org-config-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: org-config
          permission-contents: read

      # THE TOOLS REF ((internal ref) D4, (internal ref)): `job.workflow_sha` is the commit
      # of THIS reusable file, so the scripts below are the ones it was reviewed
      # with; `tools-ref` overrides it for a test. An EMPTY ref would check out the
      # tools repo's DEFAULT branch fleet-wide, so it is refused. `toJSON(job)` because
      # actionlint's `job` schema (1.7.12) does not know `workflow_sha`.
      - name: Resolve the tools ref, refusing an empty one
        id: tools-ref
        env:
          TOOLS_REF: ${{ 'main' }}
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          if [ -z "$TOOLS_REF" ]; then
            case "$JOB_CONTEXT" in
              *'"workflow_sha"'*) TOOLS_REF="${JOB_CONTEXT#*\"workflow_sha\": \"}"; TOOLS_REF="${TOOLS_REF%%\"*}" ;;
            esac
          fi
          if ! [[ "$TOOLS_REF" =~ ^[0-9a-f]{40}$ || ( -n "$TOOLS_REF" && "$TOOLS_REF" != *[![:alnum:]._/-]* ) ]]; then
            echo "::error::the tools ref is empty or not a ref (${TOOLS_REF:-<empty>}); an empty ref would check out the tools repo's default branch instead of the commit this workflow was pinned at. Refusing."
            exit 1
          fi
          echo "ref=$TOOLS_REF" >> "$GITHUB_OUTPUT"
          echo "tools ref: $TOOLS_REF"
      - name: Check out the shared checker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/org-config
          token: ${{ steps.org-config-token.outputs.token }}
          ref: ${{ 'main' }}
          path: .org-config-tools
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Nothing is pip-installed: the checker imports only the standard library
      # and shells out to `gh`, which is preinstalled on the runner. Asserted
      # rather than assumed -- the selftest imports the module and would fail on
      # a missing import, and it runs with no pip step in `selftests.yml`.
      - name: Bugbot review gate
        env:
          # `github.token`, not `secrets.inherit`: this needs only the scopes
          # declared above, and inheriting would hand it every secret the caller
          # holds for no gain ((internal ref) Q5).
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MIN_SEVERITY: ${{ 'high' }}
          WAIT_SECONDS: ${{ 660 }}
          POLL_SECONDS: ${{ 30 }}
        # No interpolation of any PR-controlled string into this shell: the
        # checker reads everything it needs from the API itself, so a finding
        # title or a branch name never transits a command line.
        run: python3 .org-config-tools/scripts/bugbot-gate.py
