name: Model-zoo paths

# Binds this repo's notebooks to the model zoo they tell people to clone.
#
# quickstart#11: the guide's upload cell named
# `image_classification/pytorch/densenet.py`, which the zoo had stopped
# shipping. Nothing connected the two repos, so the guide's own default
# raised FileNotFoundError for anyone running it top to bottom, and only a
# human executing the notebook end to end found it. Fixing the path fixes
# one instance; this job is what stops the class.
#
# `paths:` is deliberately ABSENT, for the same reason template-rules.yml
# says so: a path filter would mean editing the checker itself skips the
# job that runs it. It also would not help — the input that rots is in
# ANOTHER REPOSITORY, so a run triggered only by changes here would go
# green on the day the zoo drops a file. That is what the nightly
# schedule below is for: the guide can break without a commit landing
# anywhere in this repo.
#
# NOT ON PULL REQUESTS: a zoo change can turn it red on a pull request that
# changed nothing it reads, and no pull request is required to pass it. Run
# `python3 scripts/check_zoo_paths.py --zoo ../model-zoo` before you push.
#
# The checker's mutation harness is not run here: every mutation row runs on the
# weekly schedule, in mutation-nightly.yml (`make mutation-nightly`), against a
# fresh clone of the zoo's default branch.

on:
  # `develop` only: staging and main receive the release train's merge commits, whose
  # tree a develop push run already checked, and no protection on them reads this job.
  push:
    branches: [develop]
  schedule:
    # 04:17 UTC, an arbitrary minute rather than the top of the hour where
    # every scheduled job in the fleet queues at once.
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: zoo-paths-${{ github.workflow }}-${{ github.ref }}
  # Push and scheduled runs never cancel each other: a cancelled run leaves
  # that commit with NO verdict, which reads the same as never having been checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  zoo-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the model zoo beside this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tracebloc/model-zoo
          path: model-zoo
          # No `ref:`. The guide's clone cell runs a plain
          # `git clone https://github.com/tracebloc/model-zoo.git`, which
          # gets the DEFAULT branch — so this check follows that cell
          # rather than a branch name written down here, which would
          # silently stop matching the day the default moves.

      - name: Every model-zoo path in the notebooks resolves
        run: python3 scripts/check_zoo_paths.py --zoo model-zoo
