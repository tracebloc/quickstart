name: Template rules

# Retired. The family templates are rendered by the SDK from its own copies, and the
# SDK's notebook render tests hold the template rules there. `d9-rules` keeps its name
# and passes until branch protection stops requiring it; then this file goes.
#
# `paths:` is deliberately ABSENT: a required context a path filter skips never reports,
# and the pull request waits for it for ever.

on:
  pull_request:
    # No `ready_for_review`: this job treats a draft like any other pull
    # request, so the draft's own run is already the verdict on its head.
    # Marking the PR ready would only re-run that unchanged head, and beside
    # the cancelling group below the re-run can leave a cancelled run in the
    # check suite branch protection reads. Do not add it back.
    types: [opened, reopened, synchronize]
  # `develop` only: staging and main receive the release train's merge commits, whose
  # tree a develop push run already checked, and no protection on them reads this job.
  push:
    branches: [develop]

concurrency:
  # A pull request's runs share its ref and supersede each other. A develop push run is
  # keyed by its commit and event: in one group per ref, a newer push replaces the
  # earlier commit's PENDING run, and that commit is left with no verdict at all.
  group: template-rules-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}-{2}', github.ref, github.event_name, github.sha) }}
  # PR runs supersede each other; PUSH runs must not. Cancelling on push
  # leaves the earlier commit with a cancelled run and therefore NO verdict,
  # which reads the same as never having been checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  d9-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The template rules moved to the SDK
        run: echo "The D9 template rules moved to the SDK's notebook render tests; nothing to check here."
